---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "AI Review"

# Automatic pull_request_target trigger deliberately removed (see 04-01-SUMMARY.md
# deviations): pr-reviewer-action's GitHub-platform comment publish path uses
# `gh pr comment --edit-last`, which edits the LAST comment posted by the
# authenticated identity — not a marker-based lookup. This workflow's
# github_token (the default GITHUB_TOKEN, identity github-actions[bot]) is the
# SAME identity flux-diff.yaml's mshick/add-pr-comment step uses, so a live run
# can silently overwrite an unrelated flux-diff comment (confirmed: it happened
# to PR #1063's helmrelease diff comment during Plan 04-01's proof runs).
#
# Plan 04-02 temporarily restored this trigger for its draft-skip/concurrency-dedup
# live-proof window (2026-08-05T11:04Z-11:07Z, throwaway PR #1076/branch
# test/ai-review-draft-skip, closed and branch-deleted after verification; see
# 04-02-SUMMARY.md Deviations) and confirmed no other PR's comments were touched
# during that window before removing it again here.
#
# workflow_dispatch-only until a dedicated bot identity (PAT/GitHub App) for
# this workflow removes the shared-identity collision — then restore
# pull_request_target with types: [opened, reopened, synchronize, ready_for_review].
on:
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo to review, defaults to this repo"
        required: false
        default: ""
      pr_number:
        description: "PR number to review"
        required: false
        default: ""
      force_review:
        description: "bypass the action's diff-unchanged dedup guard for a forced re-review (workflow_dispatch only)"
        required: false
        default: "false"

concurrency:
  # github.event.number is a pull_request-event-only field, always unset
  # under this workflow's workflow_dispatch-only trigger -- so this always
  # collapsed to `${{ github.workflow }}-${{ github.ref }}`, meaning two
  # different PRs dispatched from the same ref would cancel each other's
  # in-flight review. Key off inputs.pr_number (the actual review target)
  # first (WR-03 finding).
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    runs-on: k8s-cluster-ci
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Bootstrap gh CLI and python3 (not preinstalled on this runner image)
        run: |
          set -euo pipefail
          GH_VERSION="2.97.0"
          GH_SHA256="a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh

          PY_TAG="20260728"
          PY_SHA256="2db18c7bb3a47e32ff41727abd1bb5f158a17d8681931770abf0ba911f5b6580"
          curl -fsSL -o /tmp/python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-3.11.15+${PY_TAG}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          echo "${PY_SHA256}  /tmp/python.tar.gz" | sha256sum -c -
          tar -xzf /tmp/python.tar.gz -C /tmp
          sudo ln -sf /tmp/python/bin/python3 /usr/local/bin/python3
          gh --version && python3 --version

      # workflow_dispatch never populates github.event.pull_request (the
      # pull_request_target trigger that used to populate it was deliberately
      # removed, see comment block above) -- so a job-level
      # `if: ${{ !github.event.pull_request.draft }}` always evaluates
      # `!null` (true) and never actually skips a draft PR, and
      # `github.event.pull_request.base.sha` always falls through to
      # `github.sha` (whatever ref the operator happened to have selected in
      # the dispatch dropdown, unrelated to the pr_number being reviewed).
      # Resolve both the real draft status and the PR's actual base SHA from
      # the dispatched pr_number/repo inputs instead (WR-01/WR-02 findings).
      - name: Resolve PR metadata
        id: pr
        run: |
          set -euo pipefail
          gh pr view "${{ inputs.pr_number }}" \
            --repo "${{ inputs.repo || github.repository }}" \
            --json isDraft,baseRefOid \
            --jq '"draft=\(.isDraft)\nbase_sha=\(.baseRefOid)"' \
            >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout base branch
        if: ${{ steps.pr.outputs.draft != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}

      - name: AI PR Review
        if: ${{ steps.pr.outputs.draft != 'true' }}
        uses: misospace/pr-reviewer-action@6f4fb724b222f6d9a83096d6b41cd636ef3a044e # v2.1.10
        with:
          github_token: ${{ github.token }}
          repo: ${{ inputs.repo || github.repository }}
          pr_number: ${{ inputs.pr_number || github.event.pull_request.number }}
          ai_base_url: "https://litellm.${{ secrets.SECRET_DOMAIN }}/v1"
          ai_api_format: openai
          ai_model: deepseek-v4-flash
          ai_api_key: ${{ secrets.PR_REVIEWER_LITELLM_KEY }}
          ai_max_tokens: "16000"
          ai_fallback_model: qwen3-plus
          ai_fallback_api_key: ${{ secrets.PR_REVIEWER_LITELLM_KEY }}
          on_model_failure: notice
          tool_mode: native_loop
          tool_max_requests: "4"
          tool_max_rounds: "2"
          tool_loop_wall_clock_sec: "180"
          tool_request_timeout_sec: "15"
          tool_max_response_bytes: "12000"
          tool_planning_timeout_sec: "60"
          tool_planning_max_context_bytes: "30000"
          tool_planning_max_tokens: "8000"
          tool_allowed_gh_api_repos: "${{ inputs.repo || github.repository }}"
          tool_enable_for_forks: "false"
          tool_mcp_servers: "konflate=http://konflate.ai.svc.cluster.local:8080/mcp"
          standards_file: .claude/CLAUDE.md
          publish_review_comment: "true"
          force_review: ${{ inputs.force_review || 'false' }}

      - name: Surface tool harness evidence trail
        if: ${{ always() && steps.pr.outputs.draft != 'true' }}
        run: |
          # The action itself only logs an aggregate count of tool calls
          # ("N tool call(s) executed in M round(s)") — it never prints
          # individual tool names to stdout/stderr or the step summary
          # (confirmed by reading pr_reviewer/tool_loop.py and
          # scripts/sections/review.sh this session). Per-call detail,
          # including MCP tool names like mcp__konflate__*, only exists in
          # tool-harness.md (secret-masked via redact.py's mask_secrets())
          # in the job workspace. Cat the masked file so REVIEW-02's
          # evidence-pulling proof (a real mcp__konflate__ invocation) is
          # visible in this run's log, not just summarized as a count.
          if [ -f tool-harness.md ]; then
            cat tool-harness.md
          else
            echo "tool-harness.md not found (tool_mode may be off, or the loop degraded before any call)"
          fi
