---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "AI Review"

# Runs as the dedicated ai-review GitHub App (AI_REVIEW_APP_*), not
# github-actions[bot]. pr-reviewer-action publishes with `gh pr comment
# --edit-last`, which edits the last comment of the authenticated identity;
# sharing github-actions[bot] with flux-diff.yaml once overwrote a Flux Diff
# comment (04-01-SUMMARY.md), so the trigger stays tied to the separate App.
#
# auto-merge: merges an AI-approved PR from AUTOMERGE_AUTHORS once Exclusion
# Check (and Flux Diff when kubernetes/** changed) pass and the PR has no
# gate/human-required label (hard exclusion or circuit breaker). The merge is
# made with the App token so the push to main triggers health-gate.yaml, which
# owns rollback via the revert-bot App. See docs/sre-agent/AUTOMERGE-OWNER.md.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      repo:
        description: "owner/repo to review, defaults to this repo"
        required: false
        default: ""
      pr_number:
        description: "PR number to review"
        required: true
      force_review:
        description: "bypass the action's diff-unchanged dedup guard for a forced re-review (workflow_dispatch only)"
        required: false
        default: "false"

concurrency:
  # github.event.number is a pull_request-event-only field, always unset
  # under this workflow's workflow_dispatch-only trigger -- so this always
  # collapsed to `${{ github.workflow }}-${{ github.ref }}`, meaning two
  # different PRs dispatched from the same ref would cancel each other's
  # in-flight review. Key off inputs.pr_number (the actual review target)
  # first (WR-03 finding).
  group: ${{ github.workflow }}-${{ inputs.pr_number || github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    # Fork PRs never get secrets or a review under pull_request_target.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: k8s-cluster-ci
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.review.outputs.verdict }}
      draft: ${{ steps.pr.outputs.draft }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
      repo: ${{ steps.pr.outputs.repo }}
    steps:
      - name: Exchange ai-review App token
        id: app-token
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: read

      - name: Bootstrap gh CLI and python3 (not preinstalled on this runner image)
        run: |
          set -euo pipefail
          GH_VERSION="2.97.0"
          GH_SHA256="a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
          curl -fsSL -o /tmp/gh.tar.gz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh

          PY_TAG="20260728"
          PY_SHA256="2db18c7bb3a47e32ff41727abd1bb5f158a17d8681931770abf0ba911f5b6580"
          curl -fsSL -o /tmp/python.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PY_TAG}/cpython-3.11.15+${PY_TAG}-x86_64-unknown-linux-gnu-install_only.tar.gz"
          echo "${PY_SHA256}  /tmp/python.tar.gz" | sha256sum -c -
          tar -xzf /tmp/python.tar.gz -C /tmp
          sudo ln -sf /tmp/python/bin/python3 /usr/local/bin/python3
          gh --version && python3 --version

      # workflow_dispatch never populates github.event.pull_request (the
      # pull_request_target trigger that used to populate it was deliberately
      # removed, see comment block above) -- so a job-level
      # `if: ${{ !github.event.pull_request.draft }}` always evaluates
      # `!null` (true) and never actually skips a draft PR, and
      # `github.event.pull_request.base.sha` always falls through to
      # `github.sha` (whatever ref the operator happened to have selected in
      # the dispatch dropdown, unrelated to the pr_number being reviewed).
      # Resolve both the real draft status and the PR's actual base SHA from
      # the dispatched pr_number/repo inputs instead (WR-01/WR-02 findings).
      - name: Resolve PR metadata
        id: pr
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" \
            --json isDraft,baseRefOid,headRefOid \
            --jq '"draft=\(.isDraft)\nbase_sha=\(.baseRefOid)\nhead_sha=\(.headRefOid)"' \
            >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REPO: ${{ inputs.repo || github.repository }}

      - name: Checkout base branch
        if: ${{ steps.pr.outputs.draft != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.base_sha }}

      - name: AI PR Review
        id: review
        if: ${{ steps.pr.outputs.draft != 'true' }}
        uses: misospace/pr-reviewer-action@a962cdfc21c378a3b8cf2d8b194c787408e60e6b # v2.5.0
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          repo: ${{ steps.pr.outputs.repo }}
          pr_number: ${{ steps.pr.outputs.pr_number }}
          ai_base_url: "https://litellm.${{ secrets.SECRET_DOMAIN }}/v1"
          ai_api_format: openai
          ai_model: deepseek-v4-flash
          ai_api_key: ${{ secrets.PR_REVIEWER_LITELLM_KEY }}
          ai_max_tokens: "16000"
          ai_fallback_model: qwen3-plus
          ai_fallback_api_key: ${{ secrets.PR_REVIEWER_LITELLM_KEY }}
          on_model_failure: notice
          tool_mode: native_loop
          tool_max_requests: "4"
          tool_max_rounds: "2"
          tool_loop_wall_clock_sec: "180"
          tool_request_timeout_sec: "15"
          tool_max_response_bytes: "12000"
          tool_planning_timeout_sec: "60"
          tool_planning_max_context_bytes: "30000"
          tool_planning_max_tokens: "8000"
          tool_allowed_gh_api_repos: "${{ steps.pr.outputs.repo }}"
          tool_enable_for_forks: "false"
          tool_mcp_servers: "konflate=http://konflate.ai.svc.cluster.local:8080/mcp"
          standards_file: .claude/CLAUDE.md
          publish_review_comment: "true"
          force_review: ${{ inputs.force_review || 'false' }}

      - name: Surface tool harness evidence trail
        if: ${{ always() && steps.pr.outputs.draft != 'true' }}
        run: |
          # The action itself only logs an aggregate count of tool calls
          # ("N tool call(s) executed in M round(s)") — it never prints
          # individual tool names to stdout/stderr or the step summary
          # (confirmed by reading pr_reviewer/tool_loop.py and
          # scripts/sections/review.sh this session). Per-call detail,
          # including MCP tool names like mcp__konflate__*, only exists in
          # tool-harness.md (secret-masked via redact.py's mask_secrets())
          # in the job workspace. Cat the masked file so REVIEW-02's
          # evidence-pulling proof (a real mcp__konflate__ invocation) is
          # visible in this run's log, not just summarized as a count.
          if [ -f tool-harness.md ]; then
            cat tool-harness.md
          else
            echo "tool-harness.md not found (tool_mode may be off, or the loop degraded before any call)"
          fi

  auto-merge:
    name: AI Auto-merge
    needs: review
    if: >-
      needs.review.outputs.verdict == 'approve' &&
      needs.review.outputs.draft != 'true' &&
      needs.review.outputs.repo == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    env:
      AUTOMERGE_AUTHORS: "renovate[bot]"
      REPO: ${{ needs.review.outputs.repo }}
      PR_NUMBER: ${{ needs.review.outputs.pr_number }}
      HEAD_SHA: ${{ needs.review.outputs.head_sha }}
    steps:
      - name: Exchange ai-review App token
        id: app-token
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.AI_REVIEW_APP_ID }}
          private-key: ${{ secrets.AI_REVIEW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read

      - name: Wait for gates, then merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pr() { gh api "repos/${REPO}/pulls/${PR_NUMBER}"; }

          AUTHOR=$(pr | jq -r '.user.login')
          if ! tr ',' '\n' <<<"$AUTOMERGE_AUTHORS" | grep -qxF "$AUTHOR"; then
            echo "::notice::Author ${AUTHOR} is not in AUTOMERGE_AUTHORS; leaving PR #${PR_NUMBER} for the owner."
            exit 0
          fi

          REQUIRED=("Exclusion Check")
          if gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' \
               | grep -q '^kubernetes/'; then
            REQUIRED+=("Flux Diff (kubernetes, helmrelease)" "Flux Diff (kubernetes, kustomization)")
          fi

          deadline=$((SECONDS + 900))
          while :; do
            RUNS=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" --jq '.check_runs')
            pending=0
            for name in "${REQUIRED[@]}"; do
              state=$(jq -r --arg n "$name" \
                '[.[] | select(.name == $n)] | max_by(.id) // {} | "\(.status // "missing")/\(.conclusion // "")"' \
                <<<"$RUNS")
              case "$state" in
                completed/success) ;;
                completed/*)
                  echo "::notice::${name} is ${state}; leaving PR #${PR_NUMBER} for the owner."
                  exit 0 ;;
                *) pending=1 ;;
              esac
            done
            [ "$pending" -eq 0 ] && break
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::notice::Gates did not finish within 15 minutes; leaving PR #${PR_NUMBER} for the owner."
              exit 0
            fi
            sleep 30
          done

          PR_JSON=$(pr)
          if jq -e '[.labels[].name] | index("gate/human-required")' <<<"$PR_JSON" >/dev/null; then
            echo "::notice::PR #${PR_NUMBER} is labelled gate/human-required (hard exclusion or circuit breaker)."
            exit 0
          fi
          if [ "$(jq -r '.state' <<<"$PR_JSON")" != "open" ] || [ "$(jq -r '.draft' <<<"$PR_JSON")" = "true" ]; then
            echo "::notice::PR #${PR_NUMBER} is no longer an open, ready PR."
            exit 0
          fi

          # --match-head-commit refuses the merge if anything was pushed after the review.
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
          echo "::notice::Merged PR #${PR_NUMBER} at ${HEAD_SHA}; health-gate.yaml now watches the rollout."
