---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Exclusion Gate"

on:
  pull_request_target:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  exclusion-check:
    name: Exclusion Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      excluded: ${{ steps.gate.outputs.excluded }}
    steps:
      - name: Fetch exclusion config from base branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/contents/.github/exclusion-gate.yaml?ref=${{ github.event.pull_request.base.sha }}" \
            --jq '.content' | base64 -d > /tmp/exclusion-gate.yaml

      - name: Build paths-filter map
        id: build-filters
        run: |
          # Derived generically from exclusion-gate.yaml's top-level keys so a new
          # category added to the config is automatically enforced here — no hardcoded
          # category list to keep in sync (see CR-02, 01-REVIEW.md).
          FILTERS=$(yq -o=json 'with_entries(.value = .value.paths)' /tmp/exclusion-gate.yaml)
          {
            echo "filters<<EOF"
            echo "$FILTERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate path filters
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.build-filters.outputs.filters }}

      - name: Compute excluded flag and reasons
        id: gate
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          # Iterates category keys straight from exclusion-gate.yaml (in file order, so
          # ordering stays deterministic and stable as categories are added) instead of
          # enumerating them a second time here (see CR-02, 01-REVIEW.md).
          EXCLUDED=false
          REASONS=""
          for key in $(yq -o=json '. | keys' /tmp/exclusion-gate.yaml | jq -r '.[]'); do
            MATCHED=$(echo "$FILTER_OUTPUTS" | jq -r --arg k "$key" '.[$k] // "false"')
            if [[ "$MATCHED" == "true" ]]; then
              EXCLUDED=true
              REASONS="$REASONS- $(yq eval ".[\"${key}\"].reason" /tmp/exclusion-gate.yaml)"$'\n'
            fi
          done
          echo "excluded=$EXCLUDED" >> "$GITHUB_OUTPUT"
          {
            echo "reasons<<EOF"
            echo "$REASONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.excluded == 'true'
        name: Comment on excluded PR
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "exclusion-gate/${{ github.event.pull_request.number }}"
          message: |
            🚫 **Human merge required** — this PR touches cluster-critical infrastructure:

            ${{ steps.gate.outputs.reasons }}
            This PR is excluded from AI-driven auto-merge regardless of review verdict.

      - if: steps.gate.outputs.excluded == 'true'
        name: Apply gate label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "gate/human-required"
