---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Exclusion Gate"

on:
  pull_request_target:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  exclusion-check:
    name: Exclusion Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      excluded: ${{ steps.gate.outputs.excluded }}
    steps:
      - name: Check for automated-revert bypass marker
        id: bypass
        env:
          # All PR-derived values are routed through env: indirection (never interpolated
          # raw into the shell body below) — deliberately applied to every value here, not
          # just the ones strictly required, since PR title/body are attacker-controlled
          # free text on this pull_request_target trigger (D-04, T-05-15).
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'automated-revert') }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          IS_BYPASS="false"
          # Branch prefix, label, and non-fork are necessary but NOT sufficient — any
          # collaborator with ordinary push/label rights can forge those three. The
          # PR_AUTHOR_LOGIN/TYPE check is NOT the github.actor/default-token anti-pattern
          # RESEARCH.md warns against (that was about the AMBIENT identity running a
          # workflow, shared across unrelated workflows — the exact PR #1063 incident).
          # This checks the PR's own author — the revert-bot's dedicated GitHub App
          # identity (Plan 05-02), distinct and unforgeable by a human collaborator
          # (GitHub attributes App-authored PRs to a `<slug>[bot]` user with type: Bot).
          if [[ "$HEAD_REF" == auto-revert/* ]] \
             && [[ "$HAS_LABEL" == "true" ]] \
             && [[ "$HEAD_REPO" == "$BASE_REPO" ]] \
             && [[ "$PR_AUTHOR_TYPE" == "Bot" ]] \
             && [[ "$PR_AUTHOR_LOGIN" == "k8s-cluster-revert-bot[bot]" ]]; then
            IS_BYPASS="true"
          fi
          echo "is_bypass=$IS_BYPASS" >> "$GITHUB_OUTPUT"

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Fetch exclusion config from base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # `set -euo pipefail` is load-bearing here, not boilerplate. Without
          # `pipefail` the `gh api ... | base64 -d` pipeline reports the exit
          # status of `base64 -d`, which SUCCEEDS on empty input — so a failed,
          # rate-limited, or unauthorized gh call left an empty
          # /tmp/exclusion-gate.yaml behind and exited 0. Downstream that
          # produced zero categories and a published verdict of
          # excluded=false: the hard-exclusion gate silently permitting exactly
          # what it exists to block. Fail-OPEN, found during the G-05-2 audit.
          set -euo pipefail
          if ! gh api "repos/${REPO}/contents/.github/exclusion-gate.yaml?ref=${BASE_SHA}" \
               --jq '.content' | base64 -d > /tmp/exclusion-gate.yaml; then
            echo "::error::Failed to fetch .github/exclusion-gate.yaml at ${BASE_SHA} — failing closed rather than evaluating an empty exclusion config."
            exit 1
          fi
          # A fetch that "succeeded" into an empty or unparseable file is
          # indistinguishable downstream from a config that legitimately
          # declares zero exclusion categories, so assert the content
          # explicitly: non-empty, parses, and carries at least one category.
          # A red check is the correct fail-closed state for a security gate;
          # a permissive verdict derived from an empty file is not.
          if [ ! -s /tmp/exclusion-gate.yaml ]; then
            echo "::error::Fetched .github/exclusion-gate.yaml is empty — refusing to evaluate exclusions against an empty config."
            exit 1
          fi
          if ! CATEGORY_COUNT=$(yq -o=json '. | keys | length' /tmp/exclusion-gate.yaml 2>/tmp/exclusion-config-err.log); then
            echo "::error::Fetched .github/exclusion-gate.yaml does not parse as a YAML map — refusing to evaluate exclusions against it."
            cat /tmp/exclusion-config-err.log || true
            exit 1
          fi
          if [ "${CATEGORY_COUNT}" -lt 1 ]; then
            echo "::error::Fetched .github/exclusion-gate.yaml declares zero exclusion categories — refusing to publish a not-excluded verdict from it."
            exit 1
          fi
          echo "exclusion config fetched: ${CATEGORY_COUNT} categories"

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Build paths-filter map
        id: build-filters
        run: |
          set -euo pipefail
          # Derived generically from exclusion-gate.yaml's top-level keys so a new
          # category added to the config is automatically enforced here — no hardcoded
          # category list to keep in sync (see CR-02, 01-REVIEW.md).
          FILTERS=$(yq -o=json 'with_entries(.value = .value.paths)' /tmp/exclusion-gate.yaml)
          # yq emits nothing (exit 0) for an empty document, so an empty
          # $FILTERS would hand dorny/paths-filter an empty filter set and
          # every category would evaluate to a silent "false". The fetch step
          # above already asserts a non-empty config; this is the second,
          # independent check that the map actually reached this step.
          if [ -z "${FILTERS}" ] || [ "${FILTERS}" = "null" ]; then
            echo "::error::Built an empty paths-filter map from /tmp/exclusion-gate.yaml — refusing to evaluate path filters against it."
            exit 1
          fi
          {
            echo "filters<<EOF"
            echo "$FILTERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Evaluate path filters
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ steps.build-filters.outputs.filters }}

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Compute excluded flag and reasons
        id: gate
        env:
          FILTER_OUTPUTS: ${{ toJSON(steps.filter.outputs) }}
        run: |
          set -euo pipefail
          # Iterates category keys straight from exclusion-gate.yaml (in file order, so
          # ordering stays deterministic and stable as categories are added) instead of
          # enumerating them a second time here (see CR-02, 01-REVIEW.md).
          EXCLUDED=false
          REASONS=""
          # The key list is resolved and asserted BEFORE the loop rather than
          # inline as `for key in $(yq ... | jq ...)`. A command substitution in
          # a for-list is NOT subject to `-e`: when it failed, the loop simply
          # iterated zero times and this step published excluded=false with
          # exit 0 (verified: `bash -e -c 'for k in $(yq ...bad...); do ...'`
          # survives at status 0). That is a fail-OPEN in the one gate that is
          # supposed to be non-negotiable, so the failure is made explicit here.
          if ! CATEGORY_KEYS=$(yq -o=json '. | keys' /tmp/exclusion-gate.yaml | jq -r '.[]'); then
            echo "::error::Could not enumerate exclusion categories from /tmp/exclusion-gate.yaml — failing closed instead of publishing excluded=false."
            exit 1
          fi
          if [ -z "${CATEGORY_KEYS}" ]; then
            echo "::error::Exclusion config yielded zero categories — refusing to publish a not-excluded verdict from an empty category list."
            exit 1
          fi
          while IFS= read -r key; do
            MATCHED=$(echo "$FILTER_OUTPUTS" | jq -r --arg k "$key" '.[$k] // "false"')
            if [[ "$MATCHED" == "true" ]]; then
              EXCLUDED=true
              REASONS="$REASONS- $(yq eval ".[\"${key}\"].reason" /tmp/exclusion-gate.yaml)"$'\n'
            fi
          done <<< "${CATEGORY_KEYS}"
          echo "excluded=$EXCLUDED" >> "$GITHUB_OUTPUT"
          {
            echo "reasons<<EOF"
            echo "$REASONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.bypass.outputs.is_bypass != 'true' && steps.gate.outputs.excluded == 'true'
        name: Comment on excluded PR
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "exclusion-gate/${{ github.event.pull_request.number }}"
          message: |
            🚫 **Human merge required** — this PR touches cluster-critical infrastructure:

            ${{ steps.gate.outputs.reasons }}
            This PR is excluded from AI-driven auto-merge regardless of review verdict.

      - if: steps.bypass.outputs.is_bypass != 'true' && steps.gate.outputs.excluded == 'true'
        name: Apply gate label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "gate/human-required"

      - if: steps.bypass.outputs.is_bypass == 'true'
        name: Comment on bypassed PR
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "exclusion-gate-bypass/${{ github.event.pull_request.number }}"
          message: |
            ✅ **Automated health-gate revert recognized** — this PR's branch, label, and
            origin repo match the health-gate revert-bot's bypass marker (D-04).
            Exclusion and AI-review evaluation were skipped for this PR.

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Fetch circuit-breaker state from base branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Identical fail-OPEN shape to the exclusion-config fetch above: with
          # no `pipefail`, a failed gh call still exited 0 through `base64 -d`,
          # leaving an empty state file. `jq -r '.[$b].paused // false'` on an
          # empty file prints NOTHING and exits 0 (verified), so IS_PAUSED came
          # back empty, never matched "true", and the circuit breaker reported
          # paused=false — i.e. a tripped breaker silently stopped being
          # enforced. Found during the G-05-2 audit.
          set -euo pipefail
          if ! gh api "repos/${REPO}/contents/.github/health-gate/circuit-breaker-state.json?ref=${BASE_SHA}" \
               --jq '.content' | base64 -d > /tmp/circuit-breaker-state.json; then
            echo "::error::Failed to fetch .github/health-gate/circuit-breaker-state.json at ${BASE_SHA} — failing closed rather than evaluating an empty circuit-breaker state."
            exit 1
          fi
          # An empty file is NOT the same as an empty breaker state: `{}` is the
          # legitimate no-reverts-recorded value and passes this assertion, an
          # empty or non-object file does not.
          if [ ! -s /tmp/circuit-breaker-state.json ]; then
            echo "::error::Fetched circuit-breaker-state.json is empty — refusing to evaluate the breaker against it (an empty state reads as paused=false for every bucket)."
            exit 1
          fi
          if ! jq -e 'type == "object"' /tmp/circuit-breaker-state.json >/dev/null; then
            echo "::error::Fetched circuit-breaker-state.json is not a JSON object — refusing to evaluate the breaker against it."
            exit 1
          fi

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Resolve touched app buckets
        id: buckets
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read-only PR-files listing (never a checkout/execution of PR-controlled
          # content) — extracts every unique kubernetes/apps/<namespace>/<app>
          # two-segment prefix touched by this PR. Zero buckets is a valid outcome.
          #
          # Without `pipefail` a failed gh call was swallowed by the tail of
          # this pipeline and yielded an empty bucket list, which the unscoped
          # fallback below then turned into a confident-looking wrong answer —
          # so a genuinely paused bucket went unenforced. Guarded so the fetch
          # failure is loud and the check goes red instead.
          if ! BUCKETS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" \
               --paginate --jq '.[].filename' \
               | awk -F/ '$1=="kubernetes" && $2=="apps" && NF>=4 {print $3"/"$4}' \
               | sort -u | jq -R . | jq -sc .); then
            echo "::error::Failed to list files for PR #${PR_NUMBER} — cannot resolve app buckets, so the circuit-breaker state cannot be evaluated. Failing closed."
            exit 1
          fi
          # Mirror health-gate.yaml's unscoped fallback: a PR touching zero
          # kubernetes/apps/ paths must still be checked against the unscoped
          # bucket, or a paused unscoped circuit-breaker is never enforced.
          if [ "${BUCKETS}" = "[]" ]; then
            BUCKETS='["unscoped"]'
          fi
          echo "buckets=$BUCKETS" >> "$GITHUB_OUTPUT"

      - if: steps.bypass.outputs.is_bypass != 'true'
        name: Evaluate circuit-breaker pause state
        id: circuit-breaker
        env:
          BUCKETS: ${{ steps.buckets.outputs.buckets }}
        run: |
          set -euo pipefail
          PAUSED=false
          REASONS=""
          # Same for-list exemption as the category loop above: a failing
          # command substitution here would iterate zero buckets and publish
          # paused=false. Resolved and asserted before the loop instead.
          if ! BUCKET_LIST=$(echo "$BUCKETS" | jq -r '.[]'); then
            echo "::error::Could not parse the resolved bucket list — failing closed instead of publishing paused=false."
            exit 1
          fi
          if [ -z "${BUCKET_LIST}" ]; then
            echo "::error::Resolved bucket list is empty — refusing to publish a not-paused verdict without checking any bucket."
            exit 1
          fi
          while IFS= read -r bucket; do
            IS_PAUSED=$(jq -r --arg b "$bucket" '.[$b].paused // false' /tmp/circuit-breaker-state.json)
            if [[ "$IS_PAUSED" == "true" ]]; then
              PAUSED=true
              COUNT=$(jq -r --arg b "$bucket" '.[$b].reverts | length' /tmp/circuit-breaker-state.json)
              REASONS="$REASONS- \`$bucket\`: $COUNT revert(s) recorded, paused pending human re-enable"$'\n'
            fi
          done <<< "${BUCKET_LIST}"
          echo "paused=$PAUSED" >> "$GITHUB_OUTPUT"
          {
            echo "reasons<<EOF"
            echo "$REASONS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.bypass.outputs.is_bypass != 'true' && steps.circuit-breaker.outputs.paused == 'true'
        name: Comment on circuit-breaker-paused PR
        uses: mshick/add-pr-comment@v3
        with:
          message-id: "exclusion-gate-circuit-breaker/${{ github.event.pull_request.number }}"
          message: |
            🔌 **Human merge required** — circuit breaker paused for one or more app
            buckets this PR touches:

            ${{ steps.circuit-breaker.outputs.reasons }}
            A human must edit `.github/health-gate/circuit-breaker-state.json`'s
            `paused` field to `false` via a normal PR to re-enable auto-merge for
            this bucket.

      - if: steps.bypass.outputs.is_bypass != 'true' && steps.circuit-breaker.outputs.paused == 'true'
        name: Apply gate label for circuit breaker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr edit "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "gate/human-required"

  notify-exclusion:
    name: Notify hard exclusion
    needs: [exclusion-check]
    if: needs.exclusion-check.outputs.excluded == 'true'
    runs-on: k8s-cluster-ci
    environment: health-gate
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bootstrap kubectl (SHA256-verified, not preinstalled on this runner image)
        run: |
          set -euo pipefail
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable-1.35.txt)"
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL -o /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Write kubeconfig to runner-local temp file (never echoed)
        run: |
          set -euo pipefail
          # secrets.HEALTH_GATE_KUBECONFIG is referenced only via the secrets
          # context here (GitHub auto-masks it in logs); it is written
          # straight to a runner-local temp file and never assigned to an
          # env var that could be echoed or captured elsewhere in this job.
          KCFG="${RUNNER_TEMP}/health-gate-kubeconfig.yaml"
          printf '%s' "${{ secrets.HEALTH_GATE_KUBECONFIG }}" > "${KCFG}"
          chmod 600 "${KCFG}"
          printf 'KUBECONFIG=%s\n' "${KCFG}" >> "$GITHUB_ENV"

      - name: Emit HardExclusionBlocked event
        env:
          # PR number and URL are well-formed, GitHub-generated values — deliberately
          # excluding PR title/body (attacker-controlled free text on this
          # pull_request_target trigger) from the event message entirely (T-05-15).
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # `kubectl create event` is not reliably available across kubectl
          # versions (confirmed live in Plan 05-03: absent entirely on some
          # builds, present-but-different-flags on others). Hand-rolling
          # the v1/Event manifest and applying it directly is the proven
          # cross-version-safe approach already used in Plan 05-03's
          # synthetic-event tests.
          # kubectl create (not apply) - apply internally performs a get-first
          # merge-patch check, which the health-gate ServiceAccount's RBAC
          # deliberately does not grant on events (create-only, least-
          # privilege per Plan 05-01/D-02) - confirmed live: apply failed
          # "cannot get resource events" against this exact ServiceAccount.
          kubectl create -f - <<EOF
          apiVersion: v1
          kind: Event
          metadata:
            name: hard-exclusion-blocked-${{ github.run_id }}
            namespace: flux-system
          involvedObject:
            apiVersion: kustomize.toolkit.fluxcd.io/v1
            kind: Kustomization
            name: cluster-apps
            namespace: flux-system
          reason: HardExclusionBlocked
          message: "PR #${PR_NUMBER} excluded from AI-driven auto-merge: ${PR_URL}"
          type: Warning
          firstTimestamp: "${NOW}"
          lastTimestamp: "${NOW}"
          count: 1
          source:
            component: exclusion-gate.yaml
          EOF
