---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Health Gate"

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      window_override_seconds:
        description: "override the default 900 second observation window"
        required: false
        default: ""

concurrency:
  group: health-gate-main
  cancel-in-progress: false

jobs:
  health-gate:
    name: Health Gate
    environment: health-gate
    runs-on: k8s-cluster-ci
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Record health-gate job deadline
        id: job-start
        run: |
          set -euo pipefail
          echo "HEALTH_GATE_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bootstrap pinned read-only tools
        id: bootstrap
        run: |
          set -euo pipefail
          GH_VERSION="2.97.0"
          GH_SHA256="a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
          GH_URL="https://github.com/cli/cli/releases/download/v${GH_VERSION}"
          GH_ARCHIVE="gh_${GH_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/gh.tar.gz "$GH_URL/$GH_ARCHIVE"
          echo "$GH_SHA256  /tmp/gh.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gh.tar.gz -C /tmp
          sudo install -m 755 "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh

          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable-1.35.txt)"
          KUBECTL_URL="https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64"
          curl -fsSL -o /tmp/kubectl "$KUBECTL_URL/kubectl"
          curl -fsSL -o /tmp/kubectl.sha256 "$KUBECTL_URL/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 755 /tmp/kubectl /usr/local/bin/kubectl

          # Version source: live flux2 chart 2.17.2 runs distribution 2.7.5 (owner observation, 2026-10-11).
          FLUX_VERSION="2.7.5"
          # SHA source: official Flux v2.7.5 flux_2.7.5_checksums.txt linux_amd64 entry.
          FLUX_SHA256="1e92141e8498289e4b27411385aeb18396053176cf297b0cb99abd6ca8293e75"
          FLUX_URL="https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}"
          FLUX_ARCHIVE="flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/flux.tar.gz "$FLUX_URL/$FLUX_ARCHIVE"
          echo "$FLUX_SHA256  /tmp/flux.tar.gz" | sha256sum -c -
          tar -xzf /tmp/flux.tar.gz -C /tmp flux
          sudo install -m 755 /tmp/flux /usr/local/bin/flux

          # Standalone Kustomize renders only synthetic preflight fixtures; production desired state uses Flux build.
          KUSTOMIZE_VERSION="v5.8.1"
          KUSTOMIZE_SHA256="029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
          KUSTOMIZE_URL="https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize"
          KUSTOMIZE_ARCHIVE="kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/kustomize.tar.gz \
            "$KUSTOMIZE_URL/$KUSTOMIZE_VERSION/$KUSTOMIZE_ARCHIVE"
          echo "$KUSTOMIZE_SHA256  /tmp/kustomize.tar.gz" | sha256sum -c -
          tar -xzf /tmp/kustomize.tar.gz -C /tmp kustomize
          sudo install -m 755 /tmp/kustomize /usr/local/bin/kustomize

          YQ_VERSION="v4.52.5"
          YQ_SHA256="75d893a0d5940d1019cb7cdc60001d9e876623852c31cfc6267047bc31149fa9"
          YQ_URL="https://github.com/mikefarah/yq/releases/download/$YQ_VERSION"
          curl -fsSL -o /tmp/yq "$YQ_URL/yq_linux_amd64"
          echo "$YQ_SHA256  /tmp/yq" | sha256sum -c -
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

          gh --version
          kubectl version --client
          flux --version
          kustomize version
          yq --version

      - name: Authenticate to Kubernetes API
        id: auth
        run: |
          set -euo pipefail
          KCFG="$RUNNER_TEMP/health-gate-kubeconfig.yaml"
          printf '%s' "${{ secrets.HEALTH_GATE_KUBECONFIG }}" > "$KCFG"
          chmod 600 "$KCFG"
          printf 'KUBECONFIG=%s\n' "$KCFG" >> "$GITHUB_ENV"

      - name: Resolve observation window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
          WINDOW_OVERRIDE: ${{ inputs.window_override_seconds }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] \
            && [ -n "$WINDOW_OVERRIDE" ]; then
            WINDOW_SECONDS="$WINDOW_OVERRIDE"
          else
            WINDOW_SECONDS=900
          fi
          case "$WINDOW_SECONDS" in
            ''|*[!0-9]*)
              echo "window must be an integer number of seconds" >&2
              exit 2
              ;;
          esac
          if [ "$WINDOW_SECONDS" -lt 1 ] || [ "$WINDOW_SECONDS" -gt 3600 ]; then
            echo "window must be between 1 and 3600 seconds" >&2
            exit 2
          fi
          echo "WINDOW_SECONDS=$WINDOW_SECONDS" >> "$GITHUB_ENV"

      - name: Render target and parent desired state once
        id: render
        run: |
          set -euo pipefail
          umask 077
          TARGET_SHA="$GITHUB_SHA"
          if ! printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "target SHA is not a full lowercase commit SHA" >&2
            exit 2
          fi
          PARENT_SHA=$(git rev-parse "$TARGET_SHA^")
          PARENT_ROOT="$RUNNER_TEMP/health-gate-parent"
          RENDER_CACHE="$RUNNER_TEMP/health-gate-render-cache.json"
          git worktree add --detach "$PARENT_ROOT" "$PARENT_SHA" >/dev/null
          chmod 700 "$PARENT_ROOT"
          RENDER_STATUS=failed
          NOW=$(date +%s)
          JOB_DEADLINE=$((HEALTH_GATE_JOB_STARTED_AT + 1500 - 60))
          RENDER_TIMEOUT_SECONDS=$((JOB_DEADLINE - NOW))
          if [ "$RENDER_TIMEOUT_SECONDS" -gt 300 ]; then
            RENDER_TIMEOUT_SECONDS=300
          fi
          if [ "$RENDER_TIMEOUT_SECONDS" -gt 0 ]; then
            if python3 - "$RENDER_TIMEOUT_SECONDS" \
              "$TARGET_SHA" "$PARENT_SHA" "$RENDER_CACHE" \
              "$GITHUB_WORKSPACE" "$PARENT_ROOT" <<'PYTHON'
          import os
          import signal
          import subprocess
          import sys

          timeout = float(sys.argv[1])
          command = [
              "python3", "-B", "scripts/health-gate-attest.py",
              "--target-sha", sys.argv[2], "--parent-sha", sys.argv[3],
              "--render-cache-output", sys.argv[4],
              "--repo-root", sys.argv[5], "--parent-root", sys.argv[6],
          ]
          try:
              process = subprocess.Popen(command, start_new_session=True)
          except OSError:
              sys.exit(127)
          try:
              status = process.wait(timeout=timeout)
          except subprocess.TimeoutExpired:
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=1)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()
              sys.exit(124)
          sys.exit(status)
          PYTHON
            then
              RENDER_STATUS=ready
            else
              rm -f "$RENDER_CACHE"
              echo "Desired-state render failed or timed out; the poll will report an inconclusive result."
            fi
          else
            echo "No job time remains for desired-state rendering; the poll will report an inconclusive result."
          fi
          {
            echo "HEALTH_GATE_PARENT_SHA=$PARENT_SHA"
            echo "HEALTH_GATE_PARENT_ROOT=$PARENT_ROOT"
            echo "HEALTH_GATE_RENDER_CACHE=$RENDER_CACHE"
            echo "HEALTH_GATE_RENDER_STATUS=$RENDER_STATUS"
          } >> "$GITHUB_ENV"

      - name: Poll Flux conditions and classify
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          JQ_CLASSIFY=$(cat <<'JQ_CLASSIFY_EOF'
          def conditions($r; $type):
            [($r.status.conditions // [])[] | select(.type == $type)];
          def conditions_valid($r):
            ($r.status.conditions // []) as $c
            | (($c | type) == "array")
              and ([$c[].type] | length == (unique | length))
              and ([
                $c[]
                | select((.type | type) != "string" or (.type | length) == 0)
              ] | length == 0)
              and ([
                $c[]
                | select((.status | type) != "string" or
                         (.status != "True" and .status != "False" and
                          .status != "Unknown"))
              ] | length == 0)
              and ([
                $c[]
                | select(.observedGeneration != null and
                         (.observedGeneration | type) != "number")
              ] | length == 0);
          def quiet($r; $type):
            (conditions($r; $type)) as $c
            | ($c | length) == 0 or
              (($c | length) == 1 and $c[0].status == "False");
          def ready($r):
            (conditions($r; "Ready")) as $c
            | (($c | length) == 1)
              and conditions_valid($r)
              and ($r.metadata.generation | type == "number" and . >= 1)
              and $r.metadata.deletionTimestamp == null
              and $r.suspended != true
              and $c[0].status == "True"
              and $c[0].observedGeneration == $r.metadata.generation
              and $r.status.observedGeneration == $r.metadata.generation
              and quiet($r; "Reconciling")
              and quiet($r; "Stalled");
          def target_revision($r; $t):
            $r.status.lastAttemptedRevision == ("main@sha1:" + $t)
            and $r.status.lastAppliedRevision == ("main@sha1:" + $t);
          def owner_ref($r):
            (($r.metadata.labels["kustomize.toolkit.fluxcd.io/namespace"] //
              "flux-system") + "/" +
             ($r.metadata.labels["kustomize.toolkit.fluxcd.io/name"] // ""));
          def owner_identity($r):
            (($r.metadata.namespace // "default") + "/" +
             ($r.metadata.name // ""));
          def rooted_owner_chain($ks; $allks; $visited):
            owner_identity($ks) as $ident
            | if (["flux-system/cluster", "flux-system/cluster-apps"] | index($ident)) != null
              then true
              elif ($visited | index($ident)) != null then false
              else
                (owner_ref($ks)) as $ownerid
                | ($allks | map(select(owner_identity(.) == $ownerid))) as $parents
                | if ($parents | length) != 1 then false
                  else rooted_owner_chain($parents[0]; $allks; $visited + [$ident])
                  end
              end;
          def has_inventory($owner; $hr):
            (($owner.status.inventory_ids // []) | index(
              (($hr.metadata.namespace // "default") + "_" + $hr.metadata.name +
               "_helm.toolkit.fluxcd.io_HelmRelease")
            )) != null;
          def helm_inventory_id($hr):
            (($hr.metadata.namespace // "default") + "_" + $hr.metadata.name +
             "_helm.toolkit.fluxcd.io_HelmRelease");
          def kustomization_inventory_id($ks):
            (($ks.metadata.namespace // "default") + "_" + $ks.metadata.name +
             "_kustomize.toolkit.fluxcd.io_Kustomization");
          def has_helm_inventory($ks; $hr):
            (($ks.status.inventory_ids // [])
             | index(helm_inventory_id($hr))) != null;
          def latest_deployed($r):
            ($r.status.history // null) as $history
            | if ($history | type) == "array" and ($history | length) > 0
                 and all($history[];
                   (.version | type) == "number" and .version >= 1
                   and .version == (.version | floor)
                   and (.status | type) == "string")
                 and (($history | map(.version) | unique | length) ==
                      ($history | length))
              then ($history | sort_by(.version) | last)
              else null
              end;
          def candidate_owner_exception($p; $ks; $target; $parent):
            ($ks.status.lastAppliedRevision == ("main@sha1:" + $parent))
            and $ks.status.lastAttemptedRevision == ("main@sha1:" + $target)
            and ([ $p.candidate_failures[]?
              | select(.authorized == false
                       and .checks.complete_stable_sample == true
                       and .checks.not_superseded == true
                       and .checks.target_changed_effective_inputs == true
                       and
                         .checks.healthy_premerge_baseline_same_hr_uid == false
                       and .checks.live_desired_spec_and_source_match == true
                       and .checks.unique_current_owner_inventory == true
                       and
                         (.checks.attempted_generation_and_chart_identity_match
                          == true)
                       and .checks.current_terminal_retry_exhaustion == true
                       and .checks.no_competing_failure == true
                       and .checks.server_enforced_base_sha_merge_cas == false)
              | select(.owner.namespace == $ks.metadata.namespace
                       and .owner.name == $ks.metadata.name) ] | length) > 0;
          . as $p
          | ($p.target_sha // "") as $t
          | ($p.observed.kustomizations // []) as $allks
          | ($allks | map(select(.suspended != true))) as $activeks
          | ($p.observed.helmreleases // []) as $allhrs
          | ($allhrs | map(select(.suspended != true))) as $activehrs
          | ($p.observed.gitrepositories // []
               | map(select(.metadata.namespace == "flux-system" and
                            .metadata.name == "home-kubernetes"))
             | .[0] // null) as $git
          | ([ $allks[]
               | select(.metadata.namespace == "flux-system" and
                       (.metadata.name == "cluster" or
                        .metadata.name == "cluster-apps")) ]) as $roots
          | ([ $p.kustomizations[]? | select(.supported != true) ])
            as $unsupportedks
          | ([ $p.helm_releases[]? | select(.supported != true) ])
            as $unsupportedhrs
          | ([ $activehrs[] as $hr
               | ($p.helm_releases
                  | map(select(.namespace == $hr.metadata.namespace and
                              .name == $hr.metadata.name))
                  | .[0] // null) as $proof
               | select($proof == null or $proof.supported != true)
             ]) as $badhrs
          | ([ $activehrs[] as $hr
               | ($allks
                  | map(select(owner_identity(.) == owner_ref($hr)))) as $owners
               | ($owners | .[0] // null) as $owner
               | ($allks | map(select(has_inventory(.; $hr))) | length)
                 as $inventory_owners
               | select(($owners | length) != 1 or $inventory_owners != 1
                       or $owner.suspended == true
                       or (has_inventory($owner; $hr) | not)) ]) as $badowners
          | ([ $allhrs[] as $hr
               | select(([ $allks[]
                          | select(has_helm_inventory(.; $hr)) ] | length) != 1)
             ]) as $inventorymissing
          | ([ $allks[] as $ks
               | [($ks.status.inventory_ids // [])[]?
                  | select(type == "string" and
                          (endswith("_helm.toolkit.fluxcd.io_HelmRelease")
                           or
                           endswith("_kustomize.toolkit.fluxcd.io_Kustomization")))
                 ] as $ids
               | select(($ids | unique | length) != ($ids | length))
             ]) as $inventoryduplicates
          | ([ $allks[] as $ks
               | ($ks.status.inventory_ids // [])[]? as $id
               | select(($id | type) == "string"
                       and ($id
                            | endswith("_helm.toolkit.fluxcd.io_HelmRelease")
                               or
                               endswith("_kustomize.toolkit.fluxcd.io_Kustomization")))
               | select(
                   if ($id | endswith("_helm.toolkit.fluxcd.io_HelmRelease"))
                   then ([ $allhrs[] | select(helm_inventory_id(.) == $id) ] | length) != 1
                   else ([ $allks[] | select(kustomization_inventory_id(.) == $id) ] | length) != 1
                     or ([ $allks[]
                           | select((.status.inventory_ids // []) | index($id) != null)
                         ] | length) != 1
                   end
                 )
               | {ks:$ks, id:$id} ]) as $inventoryorphans
          | ([ $allks[] as $ks
               | select(owner_identity($ks) != "flux-system/cluster"
                       and owner_identity($ks) != "flux-system/cluster-apps")
               | (owner_ref($ks)) as $ownerid
               | ($allks | map(select(owner_identity(.) == $ownerid))) as $parents
               | ($allks
                  | map(select((.status.inventory_ids // [])
                              | index(kustomization_inventory_id($ks)) != null)))
                 as $inventoryparents
               | select(($ks.metadata.labels["kustomize.toolkit.fluxcd.io/name"] // "") == ""
                       or ($ks.metadata.labels["kustomize.toolkit.fluxcd.io/namespace"] // "") == ""
                       or ($parents | length) != 1
                       or $parents[0].suspended == true
                       or ($inventoryparents | length) != 1
                       or owner_identity($inventoryparents[0]) != $ownerid
                       or (rooted_owner_chain($ks; $allks; []) | not))
               | $ks ]) as $badksowners
          | ([ $p.helm_releases[]? as $proof
               | select([$allhrs[]
                        | select(.metadata.namespace == $proof.namespace and
                                .metadata.name == $proof.name)] | length == 0)
             ]) as $missinghrs
          | ([ $p.kustomizations[]? as $proof
               | select([$allks[]
                        | select(.metadata.namespace == $proof.namespace and
                                .metadata.name == $proof.name)] | length == 0)
             ]) as $missingks
          | ([ $activehrs[] as $hr
               | ($p.helm_releases
                  | map(select(.namespace == $hr.metadata.namespace and
                              .name == $hr.metadata.name))
                  | .[0] // null) as $proof
               | select($proof != null and $proof.supported == true)
               | ($p.observed.ocirepositories
                  | map(select(.metadata.namespace == $proof.source_namespace
                               and
                               .metadata.name == $proof.source_name))
                  | .[0] // null) as $source
               | ($hr.status.lastAttemptedConfigDigest // "") as $attempt
               | (latest_deployed($hr)) as $deployed
               | select($hr.metadata.generation !=
                        $hr.status.lastAttemptedGeneration
                        or $hr.metadata.generation !=
                           $hr.status.observedGeneration
                        or $hr.status.lastAttemptedRevision !=
                           ($proof.source_tag + "+" +
                            ($proof.source_digest | sub("^sha256:"; "")[0:12]))
                        or $hr.status.lastAttemptedRevisionDigest !=
                           $proof.source_digest
                        or $source == null
                        or $source.status.artifact_revision !=
                           ($proof.source_tag + "@" + $proof.source_digest)
                        or (ready($source) | not)
                        or $deployed == null or $deployed.status != "deployed"
                        or $deployed.chartVersion != $proof.source_tag
                        or $deployed.ociDigest != $proof.source_digest
                        or $attempt == "" or $deployed.configDigest != $attempt
                        or (ready($hr) | not)) ]) as $badhrhealth
          | ([ $activeks[]
               | select((ready(.) | not) or (target_revision(.; $t) | not)
                       or .spec.sourceRef.kind != "GitRepository"
                       or .spec.sourceRef.name != "home-kubernetes"
                       or ((.spec.sourceRef.namespace // .metadata.namespace) !=
                           "flux-system")) ]) as $badkshealth
          | ([ $activeks[] | select((target_revision(.; $t) | not)
                          and
                            (candidate_owner_exception($p; .; $t;
                              $p.parent_sha // "") | not)) ]) as $mixed
          | ([ $activeks[] | select((conditions(.; "Ready") | length) != 1
                                    or (conditions_valid(.) | not)
                                    or .metadata.generation == null
                                    or .status.observedGeneration == null) ])
            as $malformedks
          | ([ $activehrs[] | select((conditions(.; "Ready") | length) != 1
                                     or (conditions_valid(.) | not)
                                     or .metadata.generation == null
                                     or .status.observedGeneration == null) ])
            as $malformedhrs
          | ([ $allhrs[] as $hr
               | ($p.helm_releases
                  | map(select(.namespace == $hr.metadata.namespace and
                              .name == $hr.metadata.name))
                  | length) as $n
               | select($n != 1) ]) as $setmismatch
          | ([ $allks[] as $ks
               | ($p.kustomizations
                  | map(select(.namespace == $ks.metadata.namespace and
                              .name == $ks.metadata.name))
                  | length) as $n
               | select($n != 1) ]) as $ksmismatch
          | ([ $roots[] | select(.suspended == true or (ready(.) | not)
                                  or .status.lastAttemptedRevision !=
                                     ("main@sha1:" + $t)
                                  or .status.lastAppliedRevision !=
                                     ("main@sha1:" + $t)) ]) as $badroots
          | ((($p.sample_valid == true)
              and ($p.superseded != true) and ($t | test("^[0-9a-f]{40}$"))
              and ($git != null)
              and (ready($git))
              and $git.status.artifact_revision == ("main@sha1:" + $t)
              and ($roots | length) == 2
              and ($activeks | length) > 0
              and ($activehrs | length) > 0
              and ($unsupportedks | length) == 0
              and ($unsupportedhrs | length) == 0
              and ($missinghrs | length) == 0
              and ($missingks | length) == 0
              and ($badhrs | length) == 0
              and ($badowners | length) == 0
              and ($badksowners | length) == 0
              and ($inventorymissing | length) == 0
              and ($inventoryduplicates | length) == 0
              and ($inventoryorphans | length) == 0
              and ($badhrhealth | length) == 0
              and ($badkshealth | length) == 0
              and ($badroots | length) == 0
              and ($malformedks | length) == 0
              and ($malformedhrs | length) == 0
              and ($missinghrs | length) == 0
              and ($missingks | length) == 0
              and ($setmismatch | length) == 0
              and ($ksmismatch | length) == 0
              and ($mixed | length) == 0)) as $allready
          | ((($p.sample_valid == true)
              and ($p.superseded != true)
              and ($git != null)
              and (ready($git))
              and $git.status.artifact_revision == ("main@sha1:" + $t)
              and ($roots | length) == 2
              and ($malformedks | length) == 0
              and ($malformedhrs | length) == 0
              and ($setmismatch | length) == 0
              and ($ksmismatch | length) == 0
              and ($badowners | length) == 0
              and ($badksowners | length) == 0
              and ($inventorymissing | length) == 0
              and ($inventoryduplicates | length) == 0
              and ($inventoryorphans | length) == 0
              and ($mixed | length) == 0
              and ($missinghrs | length) == 0
              and ($missingks | length) == 0
              and ($setmismatch | length) == 0
              and ($ksmismatch | length) == 0
              and ($badroots | length) == 0)) as $samplevalid
          | ([ $p.diagnostics[]?
               | {kind, namespace, name, code, reason} ]) as $diagnostics
          | ([ $badowners[]
               | {kind:"HelmRelease", namespace:.metadata.namespace,
                  name:.metadata.name, code:"owner-inventory-invalid",
                  reason:"owner-inventory-invalid"} ]) as $ownerdiags
          | ([ $badksowners[]
               | {kind:"Kustomization", namespace:.metadata.namespace,
                  name:.metadata.name, code:"kustomization-owner-inventory-invalid",
                  reason:"kustomization-owner-inventory-invalid"} ]) as $ksownerdiags
          | ([ $mixed[]
               | {kind:"Kustomization", namespace:.metadata.namespace,
                  name:.metadata.name, code:"revision-not-target",
                  reason:"revision-not-target"} ]) as $revisiondiags
          | ([ $badhrhealth[]
               | {kind:"HelmRelease", namespace:.metadata.namespace,
                  name:.metadata.name, code:"helm-attempt-not-settled",
                  reason:"helm-attempt-not-settled"} ]) as $hrdiags
          | ([ $badkshealth[]
               | {kind:"Kustomization", namespace:.metadata.namespace,
                  name:.metadata.name,
                  code:"kustomization-not-settled-at-target",
                  reason:"kustomization-not-settled-at-target"} ]) as $ksdiags
          | ([ $unsupportedhrs[]
               | {kind:"HelmRelease", namespace, name,
                  code:.reason_code,
                  reason:.reason_code} ]) as $unsupporteddiags
          | ([ $unsupportedks[]
               | {kind:"Kustomization", namespace, name,
                  code:.reason_code,
                  reason:.reason_code} ]) as $unsupportedksdiags
          | ([ $missinghrs[]
               | {kind:"HelmRelease", namespace, name,
                  code:"desired-helmrelease-not-live",
                  reason:"desired-helmrelease-not-live"} ]) as $missinghrdiags
          | ([ $missingks[]
               | {kind:"Kustomization", namespace, name,
                  code:"desired-kustomization-not-live",
                  reason:"desired-kustomization-not-live"} ]) as $missingksdiags
          | ([ $inventorymissing[]
               | {kind:"HelmRelease", namespace:.metadata.namespace,
                  name:.metadata.name,
                  code:"inventory-closure-invalid",
                  reason:"inventory-closure-invalid"} ])
            as $inventorymissingdiags
          | ([ $inventoryduplicates[]
               | {kind:"Kustomization", namespace:.metadata.namespace,
                  name:.metadata.name,
                  code:"inventory-duplicate",
                  reason:"inventory-duplicate"} ])
            as $inventoryduplicatediags
          | ([ $inventoryorphans[]
               | {kind:"Kustomization", namespace:.ks.metadata.namespace,
                  name:.ks.metadata.name, code:"inventory-orphan",
                  reason:"inventory-orphan"} ]) as $inventoryorphandiags
          | ($diagnostics + $ownerdiags + $ksownerdiags + $revisiondiags + $hrdiags + $ksdiags +
             $unsupporteddiags + $unsupportedksdiags + $missinghrdiags +
             $missingksdiags + $inventorymissingdiags +
             $inventoryduplicatediags + $inventoryorphandiags) as $all_diag
          | {all_ready:$allready, stalled_or_failed:[],
             diagnostics:($all_diag
                          | unique_by([.kind,.namespace,.name,.code])),
             sample_valid:$samplevalid, superseded:($p.superseded == true)}
          JQ_CLASSIFY_EOF
          )
          JQ_CLASSIFY_WITH_SUPERSEDED=".superseded = (.superseded or \$superseded) | $JQ_CLASSIFY"

          TARGET_SHA="$GITHUB_SHA"
          PARENT_SHA="$HEALTH_GATE_PARENT_SHA"
          PARENT_ROOT="$HEALTH_GATE_PARENT_ROOT"
          RENDER_CACHE="$HEALTH_GATE_RENDER_CACHE"
          PRIVATE=$(mktemp -d "$RUNNER_TEMP/health-gate-private.XXXXXX")
          chmod 700 "$PRIVATE"
          cleanup() {
            git worktree remove --force "$PARENT_ROOT" >/dev/null 2>&1 || true
            rm -rf "$PRIVATE"
          }
          trap cleanup EXIT

          cat > "$PRIVATE/run-bounded.py" <<'PYTHON'
          import os
          import signal
          import subprocess
          import sys

          timeout = float(sys.argv[1])
          command = sys.argv[2:]
          try:
              process = subprocess.Popen(command, start_new_session=True)
          except OSError:
              sys.exit(127)
          try:
              status = process.wait(timeout=timeout)
          except subprocess.TimeoutExpired:
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              try:
                  process.wait(timeout=0.5)
              except subprocess.TimeoutExpired:
                  try:
                      os.killpg(process.pid, signal.SIGKILL)
                  except ProcessLookupError:
                      pass
                  process.wait()
              sys.exit(124)
          sys.exit(status)
          PYTHON
          cat > "$PRIVATE/snapshot-json.py" <<'PYTHON'
          import json
          import pathlib
          import sys

          before = pathlib.Path(sys.argv[1])
          after = pathlib.Path(sys.argv[2])
          result = {}
          for phase, root in (("before", before), ("after", after)):
              result[phase] = {}
              for name in ("kustomizations", "helmreleases", "gitrepositories",
                           "ocirepositories", "helmrepositories", "helmcharts"):
                  result[phase][name] = json.loads(
                      (root / (name + ".json")).read_text()
                  )
          result["main_before"] = sys.argv[4]
          result["main_after"] = sys.argv[5]
          result["superseded"] = sys.argv[6] == "true"
          pathlib.Path(sys.argv[3]).write_text(
              json.dumps(result, separators=(",", ":"))
          )
          PYTHON
          chmod 600 "$PRIVATE"/*.py

          run_bounded() {
            local requested="$1"
            shift
            local remaining budget status
            POLL_LAST_CALL_TIMED_OUT=false
            remaining=$((POLL_WALL_DEADLINE - SECONDS))
            if [ "$remaining" -le 1 ]; then
              POLL_WALL_EXPIRED=true
              POLL_LAST_CALL_TIMED_OUT=true
              return 124
            fi
            budget="$requested"
            if [ "$budget" -ge "$remaining" ]; then
              budget=$((remaining - 1))
            fi
            if [ "$budget" -le 0 ]; then
              POLL_WALL_EXPIRED=true
              POLL_LAST_CALL_TIMED_OUT=true
              return 124
            fi
            if python3 "$PRIVATE/run-bounded.py" "$budget" "$@"; then
              return 0
            else
              status=$?
              if [ "$status" -eq 124 ]; then
                POLL_LAST_CALL_TIMED_OUT=true
                remaining=$((POLL_WALL_DEADLINE - SECONDS))
                if [ "$remaining" -le 1 ]; then
                  POLL_WALL_EXPIRED=true
                fi
              fi
              return "$status"
            fi
          }

          POLL_WALL_EXPIRED=false
          POLL_LAST_CALL_TIMED_OUT=false
          LAST_CLASSIFICATION_COMPLETED=false
          FLUX_UNHEALTHY=false
          FLUX_OBJECTS='[]'
          FLUX_EVIDENCE=unavailable
          FLUX_SCOPE=unavailable
          FLUX_EVIDENCE_TIME=''
          FLUX_STATE_FILE="$PRIVATE/flux-notification.json"
          SCOPE_FILE="$PRIVATE/notification-scope.json"

          write_flux_state() {
            jq -cn \
              --arg evidence "$FLUX_EVIDENCE" \
              --arg scope "$FLUX_SCOPE" \
              --arg evidence_time "$FLUX_EVIDENCE_TIME" \
              --argjson unhealthy "$FLUX_UNHEALTHY" \
              --argjson objects "$FLUX_OBJECTS" \
              '{flux_unhealthy:$unhealthy,flux_unhealthy_objects:$objects,
                flux_notification_evidence:$evidence,
                flux_notification_scope:$scope,evidence_time:$evidence_time}' \
              > "$FLUX_STATE_FILE"
          }

          publish_flux_outputs() {
            {
              echo "flux_unhealthy=$FLUX_UNHEALTHY"
              echo "flux_unhealthy_objects=$FLUX_OBJECTS"
              echo "flux_notification_evidence=$FLUX_EVIDENCE"
              echo "flux_notification_scope=$FLUX_SCOPE"
              echo "flux_evidence_time=$FLUX_EVIDENCE_TIME"
            } >> "$GITHUB_OUTPUT"
          }

          mark_flux_observation_error() {
            if [ "$FLUX_EVIDENCE" != superseded ]; then
              if [ "$FLUX_UNHEALTHY" = true ]; then
                FLUX_EVIDENCE=partial
              else
                FLUX_EVIDENCE=unavailable
              fi
            fi
            write_flux_state || true
            publish_flux_outputs
          }

          mark_flux_superseded() {
            FLUX_UNHEALTHY=false
            FLUX_OBJECTS='[]'
            FLUX_EVIDENCE=superseded
            FLUX_EVIDENCE_TIME=''
            write_flux_state
            publish_flux_outputs
          }

          record_api_error() {
            if [ "$POLL_WALL_EXPIRED" = true ] \
              && [ "$POLL_LAST_CALL_TIMED_OUT" = true ] \
              && [ "$LAST_CLASSIFICATION_COMPLETED" = true ]; then
              if LAST_RESULT=$(printf '%s' "$LAST_RESULT" | jq -c \
                --argjson observed_superseded "$EXTRA_SUPERSEDED" '
                .
                | .superseded = ((.superseded == true) or $observed_superseded)
                | if any(.diagnostics[]?; .code == "poll-deadline-after-timeout") then .
                  else .diagnostics += [{"kind":"Sample","namespace":"","name":"","code":"poll-deadline-after-timeout","reason":"poll-deadline-after-timeout"}]
                  end
              '); then
                mark_flux_observation_error
                return
              fi
            fi
            LAST_RESULT=$(printf \
              '{"target_sha":"%s","all_ready":false,"sample_valid":false,"superseded":%s,"stalled_or_failed":[],"diagnostics":[{"kind":"Sample","namespace":"","name":"","code":"api-error","reason":"api-error"}]}' \
              "$TARGET_SHA" "$EXTRA_SUPERSEDED")
            LAST_CLASSIFICATION_COMPLETED=false
            mark_flux_observation_error
          }

          record_attestation_error() {
            if [ "$POLL_WALL_EXPIRED" = true ] \
              && [ "$POLL_LAST_CALL_TIMED_OUT" = true ] \
              && [ "$LAST_CLASSIFICATION_COMPLETED" = true ]; then
              if LAST_RESULT=$(printf '%s' "$LAST_RESULT" | jq -c \
                --argjson observed_superseded "$EXTRA_SUPERSEDED" '
                .
                | .superseded = ((.superseded == true) or $observed_superseded)
                | if any(.diagnostics[]?; .code == "poll-deadline-after-timeout") then .
                  else .diagnostics += [{"kind":"Sample","namespace":"","name":"","code":"poll-deadline-after-timeout","reason":"poll-deadline-after-timeout"}]
                  end
              '); then
                return
              fi
            fi
            LAST_RESULT=$(printf \
              '{"target_sha":"%s","all_ready":false,"sample_valid":false,"superseded":%s,"stalled_or_failed":[],"diagnostics":[{"kind":"Sample","namespace":"","name":"","code":"api-error","reason":"api-error"}]}' \
              "$TARGET_SHA" "$EXTRA_SUPERSEDED")
            LAST_CLASSIFICATION_COMPLETED=false
          }

          if [ -z "$WINDOW_SECONDS" ]; then WINDOW_SECONDS=900; fi
          POLL_WALL_DEADLINE=$((SECONDS + WINDOW_SECONDS))
          if ! run_bounded 5 date +%s > "$PRIVATE/now"; then
            CURRENT_NOW=0
          else
            CURRENT_NOW=$(<"$PRIVATE/now")
          fi
          POLL_BUDGET="$WINDOW_SECONDS"
          if [[ "$HEALTH_GATE_JOB_STARTED_AT" =~ ^[0-9]+$ ]] \
            && [[ "$CURRENT_NOW" =~ ^[0-9]+$ ]]; then
            JOB_BUDGET=$((HEALTH_GATE_JOB_STARTED_AT + 1500 - CURRENT_NOW - 60))
            if [ "$JOB_BUDGET" -lt "$POLL_BUDGET" ]; then
              POLL_BUDGET="$JOB_BUDGET"
            fi
          fi
          if [ "$POLL_BUDGET" -lt 0 ]; then POLL_BUDGET=0; fi
          POLL_WALL_DEADLINE=$((SECONDS + POLL_BUDGET))
          POLL_WALL_EXPIRED=false
          DEADLINE=$((CURRENT_NOW + POLL_BUDGET))
          OUTCOME="inconclusive"
          LAST_RESULT='{"all_ready":false,"stalled_or_failed":[],"diagnostics":[],"sample_valid":false,"superseded":false}'
          LATEST_ATTESTATION_COUNTS='{}'
          EXTRA_SUPERSEDED=false
          POLL_INTERVAL_SECONDS=30

          collect_snapshot() {
            local destination="$1"
            run_bounded 5 mkdir -p "$destination" || return 1
            run_bounded 5 chmod 700 "$destination" || return 1
            run_bounded 30 kubectl get kustomizations.kustomize.toolkit.fluxcd.io \
              -A --chunk-size=500 -o json \
              > "$destination/kustomizations.json" \
              2>"$PRIVATE/kubectl.err" || return 1
            run_bounded 30 kubectl get helmreleases.helm.toolkit.fluxcd.io \
              -A --chunk-size=500 -o json \
              > "$destination/helmreleases.json" \
              2>"$PRIVATE/kubectl.err" || return 1
            run_bounded 30 kubectl get gitrepositories.source.toolkit.fluxcd.io \
              -A --chunk-size=500 -o json \
              > "$destination/gitrepositories.json" \
              2>"$PRIVATE/kubectl.err" || return 1
            run_bounded 30 kubectl get ocirepositories.source.toolkit.fluxcd.io \
              -A --chunk-size=500 -o json \
              > "$destination/ocirepositories.json" \
              2>"$PRIVATE/kubectl.err" || return 1
            run_bounded 30 kubectl get helmrepositories.source.toolkit.fluxcd.io \
              -A --chunk-size=500 -o json \
              > "$destination/helmrepositories.json" \
              2>"$PRIVATE/kubectl.err" || return 1
            run_bounded 30 kubectl get helmcharts.source.toolkit.fluxcd.io \
              -A --chunk-size=500 -o json \
              > "$destination/helmcharts.json" \
              2>"$PRIVATE/kubectl.err" || return 1
          }

          snapshot_json() {
            local before_dir="$1"
            local after_dir="$2"
            local output="$3"
            local main_before="$4"
            local main_after="$5"
            local main_superseded="$6"
            run_bounded 10 python3 -B "$PRIVATE/snapshot-json.py" \
              "$before_dir" "$after_dir" "$output" \
              "$main_before" "$main_after" "$main_superseded"
          }

          if [ "$HEALTH_GATE_RENDER_STATUS" != ready ] || [ ! -s "$RENDER_CACHE" ]; then
            LAST_RESULT=$(printf \
              '{"target_sha":"%s","all_ready":false,"sample_valid":false,"superseded":false,"stalled_or_failed":[],"diagnostics":[{"kind":"Sample","namespace":"","name":"","code":"render-cache-unavailable","reason":"render-cache-unavailable"}]}' \
              "$TARGET_SHA")
          fi

          if run_bounded 10 git diff --name-only --no-renames \
            "$PARENT_SHA" "$TARGET_SHA" > "$PRIVATE/changed-paths"; then
            if ! run_bounded 5 jq -Rsc \
              '{changed_paths:(split("\n") | map(select(length > 0)))}' \
              "$PRIVATE/changed-paths" > "$SCOPE_FILE"; then
              printf '{"scope_error":true}\n' > "$SCOPE_FILE"
            fi
          else
            printf '{"scope_error":true}\n' > "$SCOPE_FILE"
          fi
          FLUX_SCOPE=unavailable
          write_flux_state
          publish_flux_outputs

          while :; do
              if [ "$SECONDS" -ge "$POLL_WALL_DEADLINE" ]; then
                POLL_WALL_EXPIRED=true
              fi
              if [ "$POLL_WALL_EXPIRED" = true ]; then
                POLL_LAST_CALL_TIMED_OUT=true
                record_api_error
                break
              fi
              if ! run_bounded 5 date +%s > "$PRIVATE/now"; then
                record_api_error
                break
              fi
              CURRENT_NOW=$(<"$PRIVATE/now")
              if ! [[ "$CURRENT_NOW" =~ ^[0-9]+$ ]] \
                || [ "$CURRENT_NOW" -ge "$DEADLINE" ]; then
                break
              fi
              if ! run_bounded 15 gh api \
                "repos/$GITHUB_REPOSITORY/branches/main" \
                --jq '.commit.sha' > "$PRIVATE/main-before" 2>"$PRIVATE/gh.err"; then
                record_api_error
                echo "WARNING: authenticated main read failed; retrying"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              MAIN_BEFORE=$(<"$PRIVATE/main-before")
              if [ "$MAIN_BEFORE" != "$TARGET_SHA" ]; then
                EXTRA_SUPERSEDED=true
                FLUX_SCOPE=$(jq -r '.flux_notification_scope // "unavailable"' "$FLUX_STATE_FILE")
                mark_flux_superseded
                LAST_RESULT=$(printf \
                  '{"target_sha":"%s","all_ready":false,"sample_valid":false,"superseded":true,"stalled_or_failed":[],"diagnostics":[{"kind":"Main","namespace":"","name":"main","code":"superseded","reason":"main-advanced"}]}' \
                  "$TARGET_SHA")
                break
              fi

              ITERATION_DIR="$PRIVATE/iteration"
              run_bounded 5 rm -rf "$ITERATION_DIR" || true
              run_bounded 5 mkdir -p "$ITERATION_DIR" || {
                record_api_error
                break
              }
              BEFORE_DIR="$ITERATION_DIR/before"
              AFTER_DIR="$ITERATION_DIR/after"
              if ! collect_snapshot "$BEFORE_DIR"; then
                record_api_error
                echo "WARNING: pre-render Kubernetes snapshot failed; retrying"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if ! snapshot_json "$BEFORE_DIR" "$BEFORE_DIR" \
                "$PRIVATE/pre-render-snapshots.json" "$MAIN_BEFORE" "" false; then
                record_api_error
                echo "WARNING: pre-render snapshot JSON was malformed; retrying"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              PREPARED_READY=false
              if [ "$HEALTH_GATE_RENDER_STATUS" = ready ] \
                && [ -s "$RENDER_CACHE" ]; then
                if ! run_bounded 120 python3 -B scripts/health-gate-attest.py \
                  --target-sha "$TARGET_SHA" --parent-sha "$PARENT_SHA" \
                  --snapshots "$PRIVATE/pre-render-snapshots.json" \
                  --render-cache "$RENDER_CACHE" \
                  > "$PRIVATE/prepared-proof.json"; then
                  record_attestation_error
                  echo "WARNING: pre-render attestation execution failed; retrying"
                  run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                  continue
                fi
                PREPARED_READY=true
              fi

              if ! collect_snapshot "$AFTER_DIR"; then
                record_api_error
                echo "WARNING: post-render Kubernetes snapshot failed; retrying"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if ! run_bounded 15 gh api \
                "repos/$GITHUB_REPOSITORY/branches/main" \
                --jq '.commit.sha' > "$PRIVATE/main-after" 2>"$PRIVATE/gh.err"; then
                record_api_error
                echo "WARNING: closing main read failed; sample discarded"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              MAIN_AFTER=$(<"$PRIVATE/main-after")
              if [ "$MAIN_AFTER" != "$TARGET_SHA" ]; then
                EXTRA_SUPERSEDED=true
              fi
              if ! snapshot_json "$BEFORE_DIR" "$AFTER_DIR" \
                "$PRIVATE/sample.json" "$MAIN_BEFORE" "$MAIN_AFTER" \
                "$EXTRA_SUPERSEDED"; then
                record_api_error
                echo "WARNING: sampled snapshot JSON was malformed; retrying"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if OBSERVED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
                && run_bounded 15 python3 -B scripts/health-gate-flux-status.py \
                  --target-sha "$TARGET_SHA" \
                  --snapshots "$PRIVATE/sample.json" \
                  --scope "$SCOPE_FILE" \
                  --previous "$FLUX_STATE_FILE" \
                  --observed-at "$OBSERVED_AT" \
                  > "$PRIVATE/flux-notification-result.json"; then
                if jq -e '.flux_unhealthy | type == "boolean"' \
                  "$PRIVATE/flux-notification-result.json" >/dev/null; then
                  FLUX_UNHEALTHY=$(jq -r '.flux_unhealthy' "$PRIVATE/flux-notification-result.json")
                  FLUX_OBJECTS=$(jq -c '.flux_unhealthy_objects' "$PRIVATE/flux-notification-result.json")
                  FLUX_EVIDENCE=$(jq -r '.flux_notification_evidence' "$PRIVATE/flux-notification-result.json")
                  FLUX_SCOPE=$(jq -r '.flux_notification_scope' "$PRIVATE/flux-notification-result.json")
                  FLUX_EVIDENCE_TIME=$(jq -r '.evidence_time // ""' "$PRIVATE/flux-notification-result.json")
                  cp -f "$PRIVATE/flux-notification-result.json" "$FLUX_STATE_FILE"
                  publish_flux_outputs
                else
                  mark_flux_observation_error
                fi
              else
                mark_flux_observation_error
              fi

              if [ "$HEALTH_GATE_RENDER_STATUS" != ready ] \
                || [ ! -s "$RENDER_CACHE" ]; then
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if [ "$PREPARED_READY" != true ]; then
                record_attestation_error
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if ! run_bounded 120 python3 -B scripts/health-gate-attest.py \
                --target-sha "$TARGET_SHA" --parent-sha "$PARENT_SHA" \
                --snapshots "$PRIVATE/sample.json" \
                --render-cache "$RENDER_CACHE" \
                > "$PRIVATE/proof.json"; then
                record_attestation_error
                echo "WARNING: attestation execution failed; notification polling continues"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if ! run_bounded 10 jq -c \
                '{total:.counts.helmreleases_total,
                 supported:.counts.helmreleases_supported,
                unsupported:.counts.helmreleases_unsupported,
                reason_codes:.counts.reason_codes}' "$PRIVATE/proof.json" \
                > "$PRIVATE/counts.json"; then
                record_attestation_error
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              LATEST_ATTESTATION_COUNTS=$(<"$PRIVATE/counts.json")
              if ! run_bounded 10 jq -S \
                '{target_sha,parent_sha,kustomizations,helm_releases}' \
                "$PRIVATE/prepared-proof.json" > "$PRIVATE/prepared-key.json" \
                || ! run_bounded 10 jq -S \
                  '{target_sha,parent_sha,kustomizations,helm_releases}' \
                  "$PRIVATE/proof.json" > "$PRIVATE/proof-key.json" \
                || ! run_bounded 5 cmp -s \
                  "$PRIVATE/prepared-key.json" "$PRIVATE/proof-key.json"; then
                record_attestation_error
                echo "WARNING: render inputs changed or could not be compared; discarding"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              if ! run_bounded 10 jq -c \
                --argjson superseded "$EXTRA_SUPERSEDED" \
                "$JQ_CLASSIFY_WITH_SUPERSEDED" \
                "$PRIVATE/proof.json" > "$PRIVATE/result.json" 2>"$PRIVATE/jq.err"; then
                record_attestation_error
                echo "WARNING: sanitized proof could not be classified; retrying"
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              LAST_RESULT=$(<"$PRIVATE/result.json")
              LAST_CLASSIFICATION_COMPLETED=true
              if ! run_bounded 10 jq -r '.superseded' "$PRIVATE/result.json" \
                > "$PRIVATE/superseded"; then
                record_attestation_error
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              SUPERSEDED=$(<"$PRIVATE/superseded")
              if [ "$SUPERSEDED" = "true" ]; then
                break
              fi
              if ! run_bounded 10 jq -r '.all_ready' "$PRIVATE/result.json" \
                > "$PRIVATE/all-ready"; then
                record_attestation_error
                run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
                continue
              fi
              ALL_READY=$(<"$PRIVATE/all-ready")
              if [ "$ALL_READY" = "true" ]; then
                OUTCOME="healthy"
                break
              fi
              run_bounded "$POLL_INTERVAL_SECONDS" sleep "$POLL_INTERVAL_SECONDS" || true
          done

          if [ "$OUTCOME" = "healthy" ]; then
            ALL_READY=true
            echo "Health gate proved the complete target state for $TARGET_SHA."
          else
            ALL_READY=false
            echo "Health gate did not prove the target state for $TARGET_SHA."
          fi
          echo "HelmRelease attestation counts: $LATEST_ATTESTATION_COUNTS"
          REVERT_BUCKETS=$(git diff --name-only "$PARENT_SHA" "$TARGET_SHA" \
            | awk -F/ '
              $1 == "kubernetes" && $2 == "apps" && NF >= 4 {
                print $3 "/" $4
              }
            ' \
            | sort -u | jq -R . | jq -sc .)
          if [ "$REVERT_BUCKETS" = "[]" ]; then
            REVERT_BUCKETS='["unscoped"]'
          fi
          if [ "$FLUX_UNHEALTHY" = true ]; then
            FLUX_PAGE_STATUS=paging
          else
            FLUX_PAGE_STATUS=non-paging
          fi
          if [ "$HEALTH_GATE_RENDER_STATUS" != ready ] \
            || [ ! -s "$RENDER_CACHE" ]; then
            LAST_RESULT=$(printf '%s' "$LAST_RESULT" | jq -c '
              if any(.diagnostics[]?; .code == "render-cache-unavailable") then .
              else .diagnostics += [{"kind":"Sample","namespace":"","name":"","code":"render-cache-unavailable","reason":"render-cache-unavailable"}]
              end
            ')
          fi
          FLUX_OBJECT_COUNT=$(printf '%s' "$FLUX_OBJECTS" | jq 'length')
          {
            echo "all_ready=$ALL_READY"
            echo "outcome=$OUTCOME"
            echo "rollback_authorized=false"
            echo "stalled_or_failed=[]"
            echo "revert_buckets=$REVERT_BUCKETS"
            echo "attestation_counts=$LATEST_ATTESTATION_COUNTS"
            echo "flux_unhealthy=$FLUX_UNHEALTHY"
            echo "flux_unhealthy_objects=$FLUX_OBJECTS"
            echo "flux_notification_evidence=$FLUX_EVIDENCE"
            echo "flux_notification_scope=$FLUX_SCOPE"
            echo "flux_evidence_time=$FLUX_EVIDENCE_TIME"
          } >> "$GITHUB_OUTPUT"
          {
            echo "diagnostics<<HEALTHGATEEOF"
            printf '%s\n' "$LAST_RESULT"
            echo "HEALTHGATEEOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Desired-input attestation"
            echo ""
            echo "HelmRelease counts and unsupported reason codes:"
            echo "\`$LATEST_ATTESTATION_COUNTS\`."
            echo ""
            echo "Flux notification: $FLUX_PAGE_STATUS; scope=$FLUX_SCOPE; evidence=$FLUX_EVIDENCE; objects=$FLUX_OBJECT_COUNT; target=$TARGET_SHA"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - name: Emit inconclusive notification
        id: notify-inconclusive
        if: steps.poll.outputs.outcome == 'inconclusive'
        env:
          RESULT: ${{ steps.poll.outputs.diagnostics }}
          FLUX_UNHEALTHY: ${{ steps.poll.outputs.flux_unhealthy }}
          FLUX_UNHEALTHY_OBJECTS: ${{ steps.poll.outputs.flux_unhealthy_objects }}
          FLUX_NOTIFICATION_EVIDENCE: ${{ steps.poll.outputs.flux_notification_evidence }}
          FLUX_NOTIFICATION_SCOPE: ${{ steps.poll.outputs.flux_notification_scope }}
          FLUX_EVIDENCE_TIME: ${{ steps.poll.outputs.flux_evidence_time }}
        run: |
          set -euo pipefail
          CODES=$(printf '%s' "$RESULT" | jq -r \
            '[.diagnostics[]?.code] | unique | join(", ")')
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          EVENT_TYPE=Normal
          OBJECT_DETAILS=''
          if [ "${FLUX_UNHEALTHY:-false}" = true ]; then
            # Robusta 0.35.0 src/robusta/core/triggers/error_event_trigger.py:
            # WarningEventTrigger.should_fire returns False when type != Warning.
            EVENT_TYPE=Warning
            OBJECT_DETAILS=$(printf '%s' "${FLUX_UNHEALTHY_OBJECTS:-[]}" | jq -r \
              '[.[] | "\(.kind) \(.namespace)/\(.name) generation=\(.generation) \(.condition)=\(.status)(\(.reason))"] | join("; ")')
            DETAIL=$(jq -nr \
              --arg target "$GITHUB_SHA" --arg run "$RUN_URL" \
              --arg scope "${FLUX_NOTIFICATION_SCOPE:-unavailable}" \
              --arg evidence "${FLUX_NOTIFICATION_EVIDENCE:-unavailable}" \
              --arg time "${FLUX_EVIDENCE_TIME:-unknown}" \
              --arg objects "$OBJECT_DETAILS" \
              '"Health was not proven for target \($target). Flux reports current failure evidence at \($time): \($objects). scope=\($scope); evidence=\($evidence). Run: \($run). No rollback authorized."')
          else
            DETAIL=$(jq -nr \
              --arg target "$GITHUB_SHA" --arg run "$RUN_URL" \
              --arg scope "${FLUX_NOTIFICATION_SCOPE:-unavailable}" \
              --arg evidence "${FLUX_NOTIFICATION_EVIDENCE:-unavailable}" \
              --arg reasons "${CODES:-no-sample}" \
              '"Health was not proven for target \($target), and no qualifying current Flux failure was observed. notification evidence=\($evidence); scope=\($scope); health-gate reasons=\($reasons). Run: \($run). No rollback authorized."')
          fi
          EVENT_JSON=$(jq -cn \
            --arg name "health-gate-inconclusive-$GITHUB_RUN_ID" \
            --arg message "$DETAIL" --arg event_type "$EVENT_TYPE" --arg now "$NOW" \
            '{apiVersion:"v1",kind:"Event",
              metadata:{name:$name,namespace:"flux-system"},
              involvedObject:{apiVersion:"kustomize.toolkit.fluxcd.io/v1",
                kind:"Kustomization",name:"cluster-apps",namespace:"flux-system"},
              reason:"HealthGateInconclusive",message:$message,type:$event_type,
              firstTimestamp:$now,lastTimestamp:$now,count:1,
              source:{component:"health-gate.yaml"}}')
          printf '%s\n' "$EVENT_JSON" | kubectl create -f -

      - name: Exchange revert-bot App token for an authorized revert
        id: app-token
        if: steps.poll.outputs.rollback_authorized == 'true'
        uses: >-
          actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.REVERT_BOT_APP_ID }}
          private-key: ${{ secrets.REVERT_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create a revert proposal from the exact target
        id: revert
        if: steps.poll.outputs.rollback_authorized == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_SHA: ${{ github.sha }}
          REVERT_BUCKETS: ${{ steps.poll.outputs.revert_buckets }}
        run: |
          set -euo pipefail
          CURRENT_MAIN=$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          if [ "$CURRENT_MAIN" != "$TARGET_SHA" ]; then
            echo "main moved; proposal is superseded" >&2
            echo "and will not be retargeted" >&2
            exit 1
          fi
          FIRST_BUCKET=$(printf '%s' "$REVERT_BUCKETS" | jq -r '.[0]')
          SLUG=$(printf '%s' "$FIRST_BUCKET" | tr '/' '-')
          BRANCH="auto-revert/${SLUG}-${TARGET_SHA:0:12}-${GITHUB_RUN_ID}"
          git config user.name "k8s-cluster-revert-bot[bot]"
          git config user.email \
            "k8s-cluster-revert-bot[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          PARENT_COUNT=$(git cat-file -p "$TARGET_SHA" \
            | grep -c '^parent ' || true)
          REVERT_ARGS=(--no-edit)
          if [ "$PARENT_COUNT" -gt 1 ]; then
            REVERT_ARGS+=(-m 1)
          fi
          git revert "${REVERT_ARGS[@]}" "$TARGET_SHA"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Add the breaker charge to the revert proposal
        id: circuit-breaker
        if: steps.poll.outputs.rollback_authorized == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
          REVERT_BUCKETS: ${{ steps.poll.outputs.revert_buckets }}
        run: |
          set -euo pipefail
          WINDOW_SECONDS=86400
          THRESHOLD=3
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          STATE_FILE="$RUNNER_TEMP/circuit-breaker-state.json"
          git show \
            "$TARGET_SHA:.github/health-gate/circuit-breaker-state.json" \
            > "$STATE_FILE"
          chmod 600 "$STATE_FILE"
          while IFS= read -r bucket; do
            [ -n "$bucket" ] || continue
            jq --arg b "$bucket" --arg ts "$NOW" \
              --argjson window "$WINDOW_SECONDS" \
              --argjson threshold "$THRESHOLD" '
              ($ts | fromdateiso8601) as $now_epoch
              | .[$b] //= {reverts: [], paused: false}
              | .[$b].reverts += [$ts]
              | (.[$b].reverts
                 | map(select(($now_epoch - (. | fromdateiso8601)) <= $window))
                 | length) as $recent_count
              | .[$b].paused = ($recent_count >= $threshold)
            ' "$STATE_FILE" > "$STATE_FILE.new"
            mv "$STATE_FILE.new" "$STATE_FILE"
          done < <(printf '%s' "$REVERT_BUCKETS" | jq -r '.[]')
          cp "$STATE_FILE" .github/health-gate/circuit-breaker-state.json
          BUCKET_LIST=$(printf '%s' "$REVERT_BUCKETS" | jq -r 'join(", ")')
          git add .github/health-gate/circuit-breaker-state.json
          git commit -m "chore: update circuit-breaker state for $BUCKET_LIST"
          echo "proposal_charge=true" >> "$GITHUB_OUTPUT"

      - name: Publish the revert PR
        id: revert-pr
        if: steps.poll.outputs.rollback_authorized == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.revert.outputs.branch }}
          REVERT_BUCKETS: ${{ steps.poll.outputs.revert_buckets }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git push origin "$BRANCH"
          BUCKET_LIST=$(printf '%s' "$REVERT_BUCKETS" | jq -r 'join(", ")')
          TITLE="Auto-revert: $BUCKET_LIST unhealthy after"
          TITLE="$TITLE ${TARGET_SHA:0:7}"
          BODY="Health-gate evidence authorized a revert of $TARGET_SHA."
          BODY="$BODY The breaker charge is committed in this proposal."
          BODY="$BODY It takes effect only if the revert PR lands."
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --label automated-revert \
            --body "$BODY")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_URL##*/}" >> "$GITHUB_OUTPUT"

      - name: Verify D-03 revert PR provenance
        id: revert-provenance
        if: steps.poll.outputs.rollback_authorized == 'true' &&
            steps.revert-pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REVERT_PR: ${{ steps.revert-pr.outputs.pr_number }}
          EXPECTED_BOT: ${{ vars.REVERT_BOT_LOGIN }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$REVERT_PR"
          test -n "$EXPECTED_BOT"
          PR_JSON=$(gh pr view "$REVERT_PR" \
            --json author,baseRefName,headRefName,title,labels)
          jq -e --arg bot "$EXPECTED_BOT" --arg sha "$TARGET_SHA" '
            .author.login == $bot and .author.type == "Bot" and
            .baseRefName == "main" and
            (.headRefName | startswith("auto-revert/")) and
            (.headRefName | contains($sha[0:12])) and
            (.title | startswith("Auto-revert:")) and
            any(.labels[]; .name == "automated-revert")
          ' <<< "$PR_JSON" >/dev/null
          echo "provenance_valid=true" >> "$GITHUB_OUTPUT"

      - name: Backstop - report a failed health-gate run
        id: backstop
        if: failure()
        env:
          POLL_OUTCOME: ${{ steps.poll.outputs.outcome }}
          FLUX_UNHEALTHY: ${{ steps.poll.outputs.flux_unhealthy }}
          FLUX_UNHEALTHY_OBJECTS: ${{ steps.poll.outputs.flux_unhealthy_objects }}
          FLUX_NOTIFICATION_EVIDENCE: ${{ steps.poll.outputs.flux_notification_evidence }}
          FLUX_NOTIFICATION_SCOPE: ${{ steps.poll.outputs.flux_notification_scope }}
          FLUX_EVIDENCE_TIME: ${{ steps.poll.outputs.flux_evidence_time }}
        run: |
          set -uo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          DETAIL="Health gate failed before reaching a verdict for $GITHUB_SHA; last poll outcome: ${POLL_OUTCOME:-none}. No qualifying current Flux failure was observed. notification evidence=${FLUX_NOTIFICATION_EVIDENCE:-unavailable}; scope=${FLUX_NOTIFICATION_SCOPE:-unavailable}. Run: $RUN_URL. No rollback authorized."
          if command -v kubectl >/dev/null 2>&1 \
            && [ -n "${KUBECONFIG:-}" ]; then
            NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null \
              || printf '1970-01-01T00:00:00Z')
            EVENT_TYPE=Normal
            if [ "${FLUX_UNHEALTHY:-false}" = true ]; then
              # Backstop reuses confirmed poll evidence and performs no reads.
              EVENT_TYPE=Warning
              OBJECT_DETAILS=$(printf '%s' "${FLUX_UNHEALTHY_OBJECTS:-[]}" | jq -r \
                '[.[] | "\(.kind) \(.namespace)/\(.name) generation=\(.generation) \(.condition)=\(.status)(\(.reason))"] | join("; ")')
              DETAIL="Health gate failed before reaching a verdict for $GITHUB_SHA; last poll outcome: ${POLL_OUTCOME:-none}. Flux failure evidence at ${FLUX_EVIDENCE_TIME:-unknown}: $OBJECT_DETAILS. scope=${FLUX_NOTIFICATION_SCOPE:-unavailable}; evidence=${FLUX_NOTIFICATION_EVIDENCE:-partial}. Run: $RUN_URL. No rollback authorized."
            fi
            EVENT_JSON=$(jq -cn \
              --arg name "health-gate-inconclusive-backstop-$GITHUB_RUN_ID" \
              --arg message "$DETAIL" --arg event_type "$EVENT_TYPE" --arg now "$NOW" \
              '{apiVersion:"v1",kind:"Event",
                metadata:{name:$name,namespace:"flux-system"},
                involvedObject:{apiVersion:"kustomize.toolkit.fluxcd.io/v1",
                  kind:"Kustomization",name:"cluster-apps",namespace:"flux-system"},
                reason:"HealthGateInconclusive",message:$message,type:$event_type,
                firstTimestamp:$now,lastTimestamp:$now,count:1,
                source:{component:"health-gate.yaml"}}')
            printf '%s\n' "$EVENT_JSON" | kubectl create -f - || true
          fi
          echo "::error title=Health gate did not reach a verdict::$DETAIL"
          {
            echo "### Health gate did not reach a verdict"
            echo ""
            echo "$DETAIL"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
