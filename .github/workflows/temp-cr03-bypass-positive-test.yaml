---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# TEMPORARY TEST ARTIFACT - DELETE AFTER PHASE 05 VERIFICATION CLOSES.
#
# Created by GSD quick task 260812-oje to close WINDOWS.md #6 (open,
# unrun-verify) and 05-UAT.md Test 2.
#
# Why it exists: commit 21c299d1 ADDED a `PR_AUTHOR_TYPE == "Bot"` plus
# `PR_AUTHOR_LOGIN == "k8s-cluster-revert-bot[bot]"` requirement to
# exclusion-gate.yaml's automated-revert bypass (05-REVIEW.md CR-03). The real
# revert PRs that exercised the bypass - #1082, #1083, #1084 - ALL predate that
# commit, so no evidence yet exists that a legitimate bot-authored revert still
# bypasses the exclusion gate. If the new identity check is wrong, auto-revert
# silently stops working: the health-gate's revert PR would be gated as
# human-required and never self-merge, disabling the exact safety net Phase 6
# (auto-merge go-live) depends on. Proving the POSITIVE path is therefore the
# highest-value check in this quick task.
#
# What it does: mints the revert-bot GitHub App installation token, opens a real
# App-authored PR from auto-revert/bypass-positive-test carrying the
# automated-revert label, and STOPS. The App identity on that PR is the thing
# under test. This workflow deliberately never completes the PR it opens - the
# operator inspects the exclusion-gate result and then closes it by hand.
name: "TEMP: CR-03 bypass positive proof (delete after Phase 05 verification)"

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  bypass-positive-proof:
    name: Open a genuinely bot-authored revert PR and stop
    # REVERT_BOT_APP_ID / REVERT_BOT_APP_PRIVATE_KEY live in this environment.
    environment: health-gate
    # No cluster access needed - this is pure GitHub API, so the hosted runner
    # is correct here rather than the self-hosted k8s-cluster-ci runner.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The ambient default GITHUB_TOKEN is deliberately never used for any write.
    # Every write below (branch push, PR create) authenticates exclusively via
    # the separately-exchanged revert-bot App installation token, matching
    # health-gate.yaml's posture - and here it is also load-bearing for
    # correctness, since App authorship is precisely what is being tested.
    permissions:
      contents: read
    steps:
      # The App token is minted first so the preflight check below runs under
      # the same identity that will later create the branch and PR.
      #
      # actions/create-github-app-token registers the minted token as a masked
      # secret. Neither the token nor the private key is ever echoed, cat-ed,
      # written to a file, or placed in $GITHUB_STEP_SUMMARY anywhere in this
      # workflow - both are referenced only through `with:`/`env:` indirection.
      - name: Exchange revert-bot App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.REVERT_BOT_APP_ID }}
          private-key: ${{ secrets.REVERT_BOT_APP_PRIVATE_KEY }}

      # Fail fast rather than force-pushing or reusing leftovers from an earlier
      # run: a recycled branch or a reopened PR would carry the wrong event
      # history and could produce a misleading verdict.
      - name: Preflight - refuse to run if the test branch or PR already exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto-revert/bypass-positive-test
        run: |
          set -uo pipefail

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "PREFLIGHT FAILURE: branch ${BRANCH} already exists on the remote."
            echo "A previous run left it behind. Delete it first, then re-dispatch:"
            echo "  git push origin --delete ${BRANCH}"
            echo "This workflow will not force-push or reuse an existing branch."
            exit 1
          fi

          OPEN_PRS=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --head "${BRANCH}" --json number --jq 'length')
          if [ "${OPEN_PRS}" != "0" ]; then
            echo "PREFLIGHT FAILURE: an open PR from ${BRANCH} already exists."
            echo "Close it (WITHOUT merging) and delete the branch, then re-dispatch."
            exit 1
          fi

          echo "Preflight OK: no leftover branch or open PR for ${BRANCH}."

      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          # This checkout's git remote config authenticates as the App, so the
          # branch push below needs no separate credential wiring.
          token: ${{ steps.app-token.outputs.token }}

      - name: Create the test branch with a marker file under the excluded path
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: auto-revert/bypass-positive-test
          MARKER: kubernetes/bootstrap/talos/BYPASS-POSITIVE-TEST-MARKER.md
        run: |
          set -euo pipefail

          # Git identity mirrors health-gate.yaml's revert step so the commit is
          # attributed to the same bot identity as a genuine auto-revert.
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"

          # WHY THIS PATH: kubernetes/bootstrap/talos/** matches BOTH the `talos`
          # and `kubernetes-core` exclusion categories in .github/exclusion-gate.yaml.
          # That turns this into a crisp positive/negative discriminator instead of
          # an attempt to prove a negative: if the bypass correctly engages we see
          # the bypass comment and nothing else, whereas if the bypass FAILS to
          # engage the gate emits an unmistakable exclusion comment listing two
          # separate reasons.
          #
          # A .md file here is inert and cannot affect the cluster: talhelper reads
          # only talconfig.yaml / talenv.yaml / talsecret*, and kubernetes/bootstrap/
          # sits outside Flux's reconciled tree entirely.
          cat > "${MARKER}" <<'MARKEREOF'
          # CR-03 bypass positive-proof marker - DO NOT MERGE

          Temporary test artifact created by GSD quick task 260812-oje to prove that a
          legitimate `k8s-cluster-revert-bot[bot]`-authored revert PR still bypasses the
          exclusion gate after commit 21c299d1 (05-REVIEW.md CR-03).

          This file is inert: it is a Markdown file in a directory Flux does not
          reconcile and talhelper does not read. It must never be merged to `main`.
          Delete the branch once the verification is recorded.
          MARKEREOF

          git add "${MARKER}"
          git commit -m "test: CR-03 bypass positive-proof marker (do not merge)"
          git push origin "${BRANCH}"

      # GH_TOKEN is the App installation token, so GitHub attributes PR
      # authorship to the App itself - login `k8s-cluster-revert-bot[bot]`,
      # type `Bot`. That authorship IS the test: it is exactly what
      # exclusion-gate.yaml lines 49-50 assert on.
      - name: Open the bot-authored PR
        id: open-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto-revert/bypass-positive-test
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          PR_URL=$(gh pr create \
            --title "TEST ARTIFACT - DO NOT MERGE: CR-03 bypass positive proof" \
            --body "**TEST ARTIFACT - DO NOT MERGE. Close this PR without merging once verified.**

          Opened by the temporary \`temp-cr03-bypass-positive-test.yaml\` workflow (GSD quick task 260812-oje) to prove that a legitimate \`k8s-cluster-revert-bot[bot]\`-authored revert PR still bypasses the exclusion gate after commit 21c299d1 added the PR-author identity check (05-REVIEW.md CR-03).

          Expected: the exclusion gate posts its bypass-recognized comment and applies NO \`gate/human-required\` label, even though this PR touches \`kubernetes/bootstrap/talos/**\` (which matches both the \`talos\` and \`kubernetes-core\` exclusion categories).

          Run: ${RUN_URL}" \
            --label automated-revert \
            --head "${BRANCH}")

          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"
          echo "Opened ${PR_URL}"

      - name: Write the operator verification checklist
        env:
          PR_URL: ${{ steps.open-pr.outputs.pr_url }}
          BRANCH: auto-revert/bypass-positive-test
        run: |
          set -euo pipefail
          {
            echo "## CR-03 bypass positive proof"
            echo ""
            echo "PR opened: ${PR_URL}"
            echo ""
            echo "This workflow has stopped here on purpose. Verify the exclusion-gate run on that PR:"
            echo ""
            echo "### PASS (the identity check is correct - a real bot revert still bypasses)"
            echo ""
            echo "- [ ] The bypass comment IS present: \"**Automated health-gate revert recognized**\"."
            echo "- [ ] The \`gate/human-required\` label is ABSENT."
            echo "- [ ] The exclusion comment \"**Human merge required** - this PR touches cluster-critical infrastructure\" is ABSENT, despite the PR touching \`kubernetes/bootstrap/talos/**\`."
            echo "- [ ] In the Exclusion Gate run, every post-bypass step is SKIPPED:"
            echo "      \"Fetch exclusion config from base branch\", \"Build paths-filter map\","
            echo "      \"Evaluate path filters\", \"Compute excluded flag and reasons\","
            echo "      \"Fetch circuit-breaker state from base branch\", \"Resolve touched app buckets\","
            echo "      \"Evaluate circuit-breaker pause state\"."
            echo ""
            echo "### FAIL (regression - auto-revert is broken and Phase 6 must not proceed)"
            echo ""
            echo "- The \"**Human merge required**\" exclusion comment appears listing the \`talos\` and \`kubernetes-core\` reasons, and/or"
            echo "- the \`gate/human-required\` label is applied, and/or"
            echo "- the post-bypass steps show as EXECUTED rather than skipped."
            echo ""
            echo "In the FAIL case the health-gate's own revert PRs would be gated as human-required"
            echo "and never self-merge, disabling auto-revert entirely."
            echo ""
            echo "### Cleanup (required either way)"
            echo ""
            echo "- [ ] Close ${PR_URL} WITHOUT merging it."
            echo "- [ ] Delete the branch: \`git push origin --delete ${BRANCH}\`"
            echo "- [ ] Record the outcome in 05-UAT.md Test 2 and WINDOWS.md #6."
            echo "- [ ] Delete \`.github/workflows/temp-cr03-bypass-positive-test.yaml\` once Phase 05 verification closes."
          } >> "$GITHUB_STEP_SUMMARY"
