---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Test Health-Gate RBAC"

on:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  verify-rbac:
    name: Verify health-gate RBAC and network reachability
    environment: health-gate
    runs-on: k8s-cluster-ci
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Bootstrap kubectl (SHA256-verified, not preinstalled on this runner image)
        run: |
          set -euo pipefail
          KUBECTL_VERSION="$(curl -fsSL https://dl.k8s.io/release/stable-1.35.txt)"
          curl -fsSL -o /tmp/kubectl \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          curl -fsSL -o /tmp/kubectl.sha256 \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256"
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum -c -
          sudo install -m 755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: Write kubeconfig to runner-local temp file (never echoed)
        run: |
          set -euo pipefail
          # secrets.HEALTH_GATE_KUBECONFIG is referenced only via the secrets
          # context here (GitHub auto-masks it in logs); it is written
          # straight to a runner-local temp file and never assigned to an
          # env var that could be echoed or captured elsewhere in this job.
          KCFG="${RUNNER_TEMP}/health-gate-kubeconfig.yaml"
          printf '%s' "${{ secrets.HEALTH_GATE_KUBECONFIG }}" > "${KCFG}"
          chmod 600 "${KCFG}"
          printf 'KUBECONFIG=%s\n' "${KCFG}" >> "$GITHUB_ENV"

      - name: Verify reads for Flux source resources
        run: |
          set -euo pipefail
          for resource in \
            gitrepositories.source.toolkit.fluxcd.io \
            ocirepositories.source.toolkit.fluxcd.io \
            helmrepositories.source.toolkit.fluxcd.io \
            helmcharts.source.toolkit.fluxcd.io; do
            kubectl get "$resource" -A -o name >/dev/null
            for verb in get list watch; do
              answer=$(kubectl auth can-i "$verb" "$resource" --all-namespaces)
              test "$answer" = "yes"
            done
          done
          kubectl get kustomizations.kustomize.toolkit.fluxcd.io -A -o name >/dev/null
          kubectl get helmreleases.helm.toolkit.fluxcd.io -A -o name >/dev/null

      - name: Verify Secret and ConfigMap reads are denied
        run: |
          set -euo pipefail
          for resource in secrets configmaps; do
            for verb in get list watch; do
              answer=$(kubectl auth can-i "$verb" "$resource" --all-namespaces)
              test "$answer" = "no"
            done
          done

      - name: Verify source and Flux resource mutations are denied
        run: |
          set -euo pipefail
          for resource in \
            kustomizations.kustomize.toolkit.fluxcd.io \
            helmreleases.helm.toolkit.fluxcd.io \
            gitrepositories.source.toolkit.fluxcd.io \
            ocirepositories.source.toolkit.fluxcd.io \
            helmrepositories.source.toolkit.fluxcd.io \
            helmcharts.source.toolkit.fluxcd.io; do
            for verb in create update patch delete; do
              answer=$(kubectl auth can-i "$verb" "$resource" --all-namespaces)
              test "$answer" = "no"
            done
          done
