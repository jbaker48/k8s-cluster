---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-secret-garmin-ci-dind
  namespace: arc-runners-dind
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secrets
  target:
    name: arc-github-secret-garmin-ci-dind
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_token: "{{ .ARC_GITHUB_TOKEN_GARMIN_CI }}"
  data:
    - remoteRef:
        key: ARC_GITHUB_TOKEN_GARMIN_CI
      secretKey: ARC_GITHUB_TOKEN_GARMIN_CI
