---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners-dind
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
    # PodSecurity `privileged` for this namespace ONLY. Its one workload, garmin-ci-dind, runs a
    # `docker:dind` sidecar with securityContext.privileged: true so CDK can Docker-bundle Lambda
    # code natively (x86_64; arm64 emulation still cannot work on Talos, siderolabs/talos#11472).
    # Owner decision 2026-10-11 (garmin-ai-coach n2g4.4): accepted that PR-authored workflow code
    # drives a privileged dockerd here. Kept out of arc-runners so garmin-ci, k8s-cluster-ci and
    # ha-restarter stay under the cluster's `baseline` admission (k8s-cluster #1104).
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
