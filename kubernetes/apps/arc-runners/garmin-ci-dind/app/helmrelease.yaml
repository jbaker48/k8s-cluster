---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garmin-ci-dind
  namespace: arc-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-garmin-ci-dind
    namespace: arc-runners
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: actions-runner-controller
      namespace: arc-systems
  values:
    githubConfigUrl: "https://github.com/jbaker48/garmin-ai-coach"
    githubConfigSecret: arc-github-secret-garmin-ci-dind
    # D-02 revised value (post cluster-rebuild, 39-02 continuation): capped to maxRunners: 1,
    # NOT the originally-planned 2. 39-CONTEXT.md's per-node table is stale -- it assumed a
    # healthier node layout that no longer holds after the rebuild. Live headroom by memory
    # request as of this change: talos01 ~83% requested (~3.8Gi free, too tight for a 4Gi-request
    # Pod), talos02 ~24% requested (~36Gi free -- the only node with real room), talos03 ~98%
    # requested (effectively full). One dind Pod (500m CPU / 4Gi requests / 12Gi limits) fits
    # talos02 comfortably; two would stack 24Gi of limits onto that single node. Revisit upward
    # once node headroom allows -- see 39-02-SUMMARY.md follow-ups. minRunners: 0 per D-03,
    # matching the k8s-cluster-ci/ha-restarter/garmin-ci convention.
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: actions-runner-controller-gha-rs-controller
    # D-01/dind sizing: the gha-runner-scale-set 0.14.2 values.yaml states "If any
    # customization is required for dind or kubernetes mode, containerMode should remain
    # empty, and configuration should be applied to the template." D-01's per-container
    # resources block below is exactly such a customisation, so containerMode is left
    # entirely unset and the dind Pod is written out explicitly instead. DO NOT set
    # containerMode.type: dind here -- the chart overwrites `template` when containerMode is
    # also set, silently discarding this resources block. Shape taken from the chart's own
    # documented containerMode.type=dind expansion in
    # charts/gha-runner-scale-set/values.yaml at tag gha-runner-scale-set-0.14.2.
    template:
      metadata:
        labels:
          workload: garmin-ci-dind-runner
      spec:
        serviceAccountName: garmin-ci-dind
        automountServiceAccountToken: false
        # Discovered live during 39-01 Task 3: talos02 (the node D-01/D-02 measured as the
        # only one with request headroom) carries a stale dedicated=frigate:NoSchedule taint
        # left over from eac3ac1d, even though 2273acd4 moved Frigate itself off talos02 in
        # July 2026. Without this toleration the scheduler reports "1 node(s) had untolerated
        # taint(s)" for talos02 and "Insufficient cpu"/"Insufficient memory" for talos01/03,
        # which are both >85% requested -- the runner Pod cannot schedule anywhere. Matches
        # the existing precedent already used twice in this repo for the same reason:
        # 61fbf0e3 (cloudnative-pg cluster17) and 68c6f1ab (intel-gpu-plugin), and carried
        # into garmin-ci-dind because this scale set schedules on the same node.
        tolerations:
          - key: dedicated
            operator: Equal
            value: frigate
            effect: NoSchedule
        # arm64 reality (Risk 7, 39-CONTEXT.md): all three cluster nodes are amd64, so arm64
        # Lambda bundling stays QEMU-emulated here exactly as it is on hosted runners. Nothing
        # in this scale set makes arm64 builds faster; it only moves them off hosted minutes.
        initContainers:
          - name: init-dind-externals
            image: ghcr.io/actions/actions-runner:2.336.0
            imagePullPolicy: IfNotPresent
            command: ["cp", "-r", "/home/runner/externals/.", "/home/runner/tmpDir/"]
            volumeMounts:
              - name: dind-externals
                mountPath: /home/runner/tmpDir
          - name: dind
            image: docker:29-dind
            imagePullPolicy: IfNotPresent
            args:
              - dockerd
              - --host=unix:///var/run/docker.sock
              - --group=$(DOCKER_GROUP_GID)
            env:
              - name: DOCKER_GROUP_GID
                value: "123"
            securityContext:
              privileged: true
            # restartPolicy: Always is what makes this a native sidecar on k8s 1.35 rather
            # than a blocking init container -- without it the Pod never reaches the runner
            # container.
            restartPolicy: Always
            startupProbe:
              exec:
                command: ["docker", "info"]
              initialDelaySeconds: 0
              failureThreshold: 24
              periodSeconds: 5
            # D-01, dind sizing: QEMU arm64 emulation is the CPU- and memory-hungry half of
            # the Pod, so the dind sidecar gets the larger memory ceiling of the two
            # containers. No CPU limit, matching garmin-ci's Burstable rationale -- builds
            # burst into idle CPU once scheduled.
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 8Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
              - name: dind-externals
                mountPath: /home/runner/externals
        containers:
          # GitHub's Actions service enforces a rolling MINIMUM runner version.
          # When the pinned runner falls below it the service rejects the runner
          # and the container exits with code 7 (RunnerVersionDeprecated). ARC
          # 0.14.2 maps that to EphemeralRunner -> EphemeralRunnerSet ->
          # AutoscalingRunnerSet status.phase=Outdated, which is an ABSORBING
          # state: it deletes the listener, the ephemeral runner sets AND the
          # GitHub-side runner scale set, then never recreates anything and
          # never requeues (autoscalingrunnerset_controller.go L184/L246/L261).
          # CI is then silently and permanently dead, surviving controller
          # restarts. See upstream actions/actions-runner-controller #4595,
          # #4596 and #4600.
          # KEEP THIS PINNED AT OR NEAR THE LATEST actions/runner RELEASE.
          # Tracked by the "ARC runner image" customManager in
          # .github/renovate.json5.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.336.0
            imagePullPolicy: IfNotPresent
            command: ["/home/runner/run.sh"]
            env:
              - name: DOCKER_HOST
                value: unix:///var/run/docker.sock
              - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
                value: "120"
            # D-01: same Burstable rationale as garmin-ci -- talos02 is the only node with
            # real headroom by request; no CPU limit so jobs can burst into idle CPU once
            # scheduled.
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                memory: 4Gi
            volumeMounts:
              - name: work
                mountPath: /home/runner/_work
              - name: dind-sock
                mountPath: /var/run
        volumes:
          - name: work
            emptyDir: {}
          - name: dind-sock
            emptyDir: {}
          - name: dind-externals
            emptyDir: {}
