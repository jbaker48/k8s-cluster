---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gha-cache-server-ingress
  namespace: arc-runners
spec:
  # T-39-32/T-39-34: identity-based ingress restriction is what keeps this cache server
  # single-tenant, since it sits in the same namespace as Pods that execute PR-controlled
  # workflow code. garmin-ci-runner is the ONLY runner workload in this namespace on the
  # post-dind estate (garmin-ci-dind was retired, k8s-cluster PR #1104) — do not add a second
  # selector for a workload that does not exist, and do not widen to the namespace.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gha-cache-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            workload: garmin-ci-runner
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS resolution only — the cache server has no outbound dependency of its own. Per Risk 4
    # (39-CONTEXT.md), DEFAULT_ACTIONS_RESULTS_URL passthrough is only exercised if configured,
    # which this plan does not do.
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
