---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ha-restarter
  namespace: arc-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
    namespace: arc-runners
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: actions-runner-controller
      namespace: arc-systems
  values:
    githubConfigUrl: "https://github.com/jbaker48/home-assistant-config"
    githubConfigSecret: arc-github-secret
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: actions-runner-controller-gha-rs-controller
    template:
      spec:
        initContainers:
          - name: kube-inject
            image: bitnami/kubectl:latest
            imagePullPolicy: Always
            command: ["cp", "/opt/bitnami/kubectl/bin/kubectl", "/usr/local/bin/kubectl"]
            volumeMounts:
              - name: kubectl-bin
                mountPath: /usr/local/bin
        serviceAccountName: ha-restarter
        containers:
          # See the equivalent note in
          # ../../k8s-cluster-ci/app/helmrelease.yaml. A runner below GitHub's
          # rolling minimum version exits with code 7 and wedges the
          # AutoscalingRunnerSet permanently in phase Outdated on ARC 0.14.2.
          # This scale set was pinned to the same stale 2.334.0 and was a
          # latent identical failure - it only survived the 2026-08-12 incident
          # because it happened not to run a job after GitHub's cutover.
          # KEEP THIS PINNED AT OR NEAR THE LATEST actions/runner RELEASE.
          # Tracked by the "ARC runner image" customManager in
          # .github/renovate.json5.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.336.0
            imagePullPolicy: IfNotPresent
            command: ["/home/runner/run.sh"]
            volumeMounts:
              - name: kubectl-bin
                mountPath: /usr/local/bin
                readOnly: false
        volumes:
          - name: kubectl-bin
            emptyDir: {}
