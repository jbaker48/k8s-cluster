---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
# PodSecurity: back to the cluster default `baseline` (2026-08-29). 39-02 raised this whole
    # namespace to `privileged` for exactly one workload -- garmin-ci-dind's `dind` sidecar, which
    # sets securityContext.privileged: true. That scale set is now retired (its arm64 builds could
    # never work: Talos ships the binfmt_misc kernel module but never mounts it or registers QEMU,
    # which is out of scope for the extension per siderolabs/talos#11472), so the exemption it
    # required goes with it. Dropping these labels RESTORES a control rather than removing one:
    # `baseline` admission refuses privileged containers outright, so D-DOCKER's "PR-authored code
    # never gets a privileged container" is now enforced by the cluster itself, not only by the
    # scale-set/token/CiliumNetworkPolicy separation. No remaining arc-runners workload
    # (garmin-ci, k8s-cluster-ci, ha-restarter) declares privileged, hostPath or hostNetwork.
    #
    # KEEP THIS FILE'S LABEL SET BYTE-IDENTICAL TO THE OTHER arc-runners Namespace declaration
    # (../../namespace.yaml <-> ha-restarter/app/namespace.yaml). Both declare Namespace/arc-runners
    # under the same Flux field manager, and Server-Side Apply resolves conflicts last-applied-wins
    # per field, so a label present in one and absent from the other gets silently stripped and
    # re-added on every reconcile. That exact flapping was observed live under 39-02 -- see
    # garmin-ai-coach 39-02-SUMMARY.md.
