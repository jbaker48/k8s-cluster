---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: arc-github-secret-k8s-cluster
  namespace: arc-runners
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler-secrets
  target:
    name: arc-github-secret-k8s-cluster
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        github_token: "{{ .ARC_GITHUB_TOKEN_K8S_CLUSTER }}"
  data:
    - remoteRef:
        key: ARC_GITHUB_TOKEN_K8S_CLUSTER
      secretKey: ARC_GITHUB_TOKEN_K8S_CLUSTER
