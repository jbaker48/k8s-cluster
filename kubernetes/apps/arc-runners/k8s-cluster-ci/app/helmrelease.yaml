---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-cluster-ci
  namespace: arc-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set-k8s-cluster-ci
    namespace: arc-runners
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: actions-runner-controller
      namespace: arc-systems
  values:
    githubConfigUrl: "https://github.com/jbaker48/k8s-cluster"
    githubConfigSecret: arc-github-secret-k8s-cluster
    minRunners: 0
    maxRunners: 1
    controllerServiceAccount:
      namespace: arc-systems
      name: actions-runner-controller-gha-rs-controller
    template:
      metadata:
        labels:
          workload: k8s-cluster-ci-runner
      spec:
        serviceAccountName: k8s-cluster-ci
        automountServiceAccountToken: false
        # cluster-internal CoreDNS forwards "." straight to the node resolver
        # and has no zone delegation for ${SECRET_DOMAIN} to k8s-gateway, so
        # in-cluster pods can't resolve litellm.${SECRET_DOMAIN} via kube-dns
        # (confirmed: an unrestricted debug pod in this namespace also gets
        # NXDOMAIN — not a CiliumNetworkPolicy egress issue). Pin the hostname
        # to envoy-internal's gateway address so the runner can still reach
        # litellm only via the gateway, matching D-03's intended path. Uses
        # the repo's existing SVC_INTERNAL_GW_ADDR substitution variable (the
        # same Gateway's IPAM-pinned LoadBalancer IP) rather than the
        # dynamically-allocated ClusterIP, which is not guaranteed stable
        # across a Service recreation.
        hostAliases:
          - ip: "${SVC_INTERNAL_GW_ADDR}"
            hostnames:
              - "litellm.${SECRET_DOMAIN}"
        containers:
          # GitHub's Actions service enforces a rolling MINIMUM runner version.
          # When the pinned runner falls below it the service rejects the runner
          # and the container exits with code 7 (RunnerVersionDeprecated). ARC
          # 0.14.2 maps that to EphemeralRunner -> EphemeralRunnerSet ->
          # AutoscalingRunnerSet status.phase=Outdated, which is an ABSORBING
          # state: it deletes the listener, the ephemeral runner sets AND the
          # GitHub-side runner scale set, then never recreates anything and
          # never requeues (autoscalingrunnerset_controller.go L184/L246/L261).
          # CI is then silently and permanently dead, surviving controller
          # restarts. See upstream actions/actions-runner-controller #4595,
          # #4596 and #4600.
          # KEEP THIS PINNED AT OR NEAR THE LATEST actions/runner RELEASE.
          # Tracked by the "ARC runner image" customManager in
          # .github/renovate.json5.
          - name: runner
            image: ghcr.io/actions/actions-runner:2.336.0
            imagePullPolicy: IfNotPresent
            command: ["/home/runner/run.sh"]
